images:
  tags:
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
    # only starts the reconcile script on the host: needs a shell with mount,
    # chroot and tar, and nsenter (kubelet restart job); multi-arch
    anchor: docker.io/library/busybox:1.37
    haproxy: haproxy:1.8.25
    pause: registry.k8s.io/pause:3.10
  pull_policy: "IfNotPresent"
  local_registry:
    active: false
    exclude:
      - dep_check
      - image_repo_sync

# kubeadm, kubelet and kubectl are installed on the nodes by the bootstrap
# script and kept in sync by the anchor if cluster_config.kubernetesVersion is
# set. urls are tpl strings, ${ARCH} is substituted on the node with its
# architecture. sha256 is optional, if empty the binary is verified with
# <url>.sha256. The installation procedure can be redefined in
# bundle.tpl."templates/phases/snippets/binaries/_install.sh.tpl".
binaries:
  install_dir: /usr/local/bin
  kubeadm:
    url: "https://dl.k8s.io/release/{{ .Values.cluster_config.kubernetesVersion }}/bin/linux/${ARCH}/kubeadm"
    sha256: ""
  kubelet:
    url: "https://dl.k8s.io/release/{{ .Values.cluster_config.kubernetesVersion }}/bin/linux/${ARCH}/kubelet"
    sha256: ""
  kubectl:
    url: "https://dl.k8s.io/release/{{ .Values.cluster_config.kubernetesVersion }}/bin/linux/${ARCH}/kubectl"
    sha256: ""

bootstrap:
  compress_fs: tar
  # it's more convenient to debug if it is true
  string_data: false
  # in case there is per-node data the next field can be used to generate only script for 1 node so
  # it is easier to extract. in that case only 1 secret will be generated with the name {{ include "kubeadm.fullname" $envAll }}-bootstrap
  # without suffix-<nodename>. Using this parameter disables producing other manifests generated in _main.tpl to help sed find the needed field only.
  # this is because we assume that bootstrap.nodename is used only for manual helm template execution
  # nodename: <some node>

# daemonsets running the reconcile script (day 2) on the nodes
anchor:
  # mounts (tmpfs, service account) on the host paths in the pod, see
  # templates/bin/_ensure_fs.tpl
  securityContext:
    privileged: true
  # service account of the anchor pods and the kubelet restart jobs, created
  # in the release namespace
  service_account: kubeadm
  labels:
    common:
      node_selector_key: kubeadm
      node_selector_value: enabled
    masters:
      node_selector_key: kubernetes-apiserver
      node_selector_value: enabled
  reconcile:
    # seconds between the checks of the chart configuration
    period: 15
    # its own files (script, service account, state), mounted in the pod only
    host_dir: /var/lib/kubeadm-reconcile

etcd_service:
  name: kubernetes-etcd
  ip: "10.96.0.2"
  service_client:
    enable_node_port: false
    node_port: 32379
    port: 2379
    # TODO: must match with kubeadm.settings.etcd_servers ports
    target_port: 2379

haproxy:
  container_config_dir: /usr/local/etc/haproxy
  host_config_dir: /etc/kubernetes/kubeadm/addons
  period: 5
  conf_parts:
    global:
      - maxconn 10240
    defaults:
      - timeout connect 5000ms
      - timeout client 24h
      - timeout server 24h
    frontend:
      - mode tcp
    backend:
      - mode tcp
      - option tcp-check
      - option redispatch

files:
  # todo - can check sha256 before and after and restart containerd if needed
  cri:
    - path: /etc/containerd
      state: dir
      owner: "root:root"
    - path: /etc/containerd/config.toml
      state: tpl
      from: templates/phases/snippets/cri/_containerd_v3.tpl
      owner: "root:root"
      mode: "0600"
  # placholder for cleanup after bootstrap
  bootstrapcleanup: []
# working examples (can be moved to test.sh):
# files:
#   rm_files: #groupname
#     - path: /usr/local/share/ca/certain/dosntexist
#       state: "rm"
#   files:
#     - path: /usr/local/share/ca/certain
#       state: "dir" # or touch
#       owner: "root:root" #optional
#       mode: "0600" #optional
#     - path: /usr/local/share/ca/certain2
#       state: "copy" #  or content or tpl
#       from: "/usr/local/share/ca/certain/filename"
#       owner: "root:root" #optional
#       mode: "0600" #optional

# the permissions on the node of the files of the phases: a group is delivered
# in _<group>/ of the archives (pkipub -> _pkipub/<file>) or is a file itself.
# if there is no data, empty owner and mode are passed and setting of
# permissions is skipped in that case.
permissions:
  # certs/kubelet
  "/etc/kubernetes/pki":
    owner: "root:root"
    mode: "0700"
    groups:
      # produced by certs phase
      "pkipriv": # keys
        owner: "root:root"
        mode: "0600"
      "pkipub": # certs,
        owner: "root:root"
        mode: "0644"
      # produced by kubelet phase
      "kubeletpkipriv": # keys
        owner: "root:root"
        mode: "0600"
      "kubeletpkipub": # certs
        owner: "root:root"
        mode: "0644"
  "/etc/kubernetes/pki/etcd":
    owner: "root:root"
    mode: "0700"
    groups:
      "etcdpriv": # keys
        owner: "root:root"
        mode: "0600"
      "etcdpub": # certs,
        owner: "root:root"
        mode: "0600" #"0644"
  "/etc/kubernetes/admin/pki":
    owner: "root:root"
    mode: "0700"
    groups:
      "adminpkipriv": # keys
        owner: "root:root"
        mode: "0600"
      "adminpkipub": # certs,
        owner: "root:root"
        mode: "0600" #"0644"
  "/etc/default":
    owner: "root:root"
    groups:
      "kubelet":
        owner: "root:root"
        mode: "0600"
  "/etc/systemd/system":
    owner: "root:root"
    groups:
      "kubelet.service":
        owner: "root:root"
        mode: "0600"
      "kube-cgroup.service":
        owner: "root:root"
        mode: "0600"
  "/var/lib/kubelet":
    owner: "root:root"
    mode: "0700"
    groups:
      "config.yaml":
        owner: "root:root"
        mode: "0600"
  "/etc/kubernetes":
    owner: "root:root"
    groups:
      # produced by kubeconfig phase
      "admin.conf":
        owner: "root:root"
        mode: "0600"
      "controller-manager.conf":
        owner: "root:root"
        mode: "0600"
      "scheduler.conf":
        owner: "root:root"
        mode: "0600"
      # produced by kubelet phase
      "kubelet.conf":
        owner: "root:root"
        mode: "0600"
  "/usr/local/sbin":
    owner: "root:root"
    groups:
      "kube-cgroup.sh":
        owner: "root:root"
        mode: "0600"
  "/etc/kubernetes/kubeadm":
    owner: "root:root"
    mode: "0700"
    groups:
      "kubeadm":
        owner: "root:root"
        mode: "0600"
  "/etc/kubernetes/kubeadm/patches":
    owner: "root:root"
    mode: "0700"
    groups:
      "kubeadmpatch":
        owner: "root:root"
        mode: "0600"
  "/etc/kubernetes/apiserver":
    owner: "root:root"
    mode: "0700"
    groups:
      "kubeadmapiserver":
        owner: "root:root"
        mode: "0600"
  # haproxy static pod (vip phase) runs as nobody (65534) and reads its
  # config from this directory
  "/etc/kubernetes/kubeadm/addons":
    owner: "root:root"
    mode: "0755"
  "/etc/kubernetes/manifests":
    groups:
      # produced by vip phase
      "manifests":
        owner: "root:root"
        mode: "0600"


cluster_config: {}
  # if not specified - any in accordance to kubeadm version
  # kubernetesVersion: v1.36.3

kubeconfig:
  clusterName: kubernetes
  controlPlaneEndpoint: 127.0.0.1:6443

kubelet:
  restart: true
  # the node is drained before the restart and uncordoned after it
  drain: true
# if needed add:
#      appArmorProfile:
#        type: RuntimeDefault
  restartJobSecurityContext: |
    securityContext:
      privileged: true

cri:
  # kubelet starts after it, restart_cri restarts it
  service: containerd.service
  # the bootstrap script always runs install_cri, the reconcile script with this
  # flag. The installation procedure can be redefined in
  # bundle.tpl."templates/phases/snippets/cri/_install.sh.tpl".
  reconcile_install: false
  # the reconcile script restarts the runtime when install_cri or files.cri
  # changed it, the bootstrap script always does
  restart: false
  # auths:
  #   - repo: docker-open-nc.zc1.somedomain.com
  #     auth: user:password

# this is main data about cluster in full mode
# and potentially ca mode in case there is an
# additional haproxy static pod
# TODO: rename masters to control plance nodes everywhere, it's kubeadm terminology
# we may also don't need genesis. potenially we can bootstrap from any controller node
# they must be identical/interchangable in the end of the day
# ksn stands for k8s network
# control_plane:
#   genesis:
#     hostname: hostname0
#   masters:
#   - hostname: hostname0
#     ip:
#       ksn: 172.29.0.139
#   - hostname: hostname1
#     ip:
#       ksn: 172.29.0.144
#   - hostname: hostname2
#     ip:
#       ksn: 172.29.0.149
#   - hostname: hostname3
#     ip:
#       ksn: 172.29.0.154

# here is where all secrets are provided
# 3 options are supported:
# 1. no secrets - assuming that kubadm will be used to generate everything
# 2. ca key/crt are provided - kubeadm will be used to generate the rest
# 3. all secrets (including etcd) are pregenerated and kubeadm will be used only only for
#    certain phases like maintaining manifests
# NOTE: at the moment we don't support external etcd
# see templates/utils/_k8s_pki_val_extract.tpl for implementation details
# to use a different structure - override it in tpl section
certs:
  # expected structure:
  # perms:
  #   pki_dir:
  #     owner: "root:root"
  #     mode: "0700"
  #   pki_files:
  #     owner: "root:root"
  #     mode: "0600"
  #   etcd_dir: # inherit pki_dir if not defines
  #     owner: "root:root"
  #     mode: "0700"
  #   etcd_files: # inherit pki_files if not defines
  #     owner: "root:root"
  #     mode: "0600"

  # ca:
  #   crt: placeholder
  #   key: placeholder

  # sa:
  #   key: placeholder
  #   pub: placeholder
  # ...
  # see overrides/pki-*.yaml


# resources prefix
fullnameOverride: kubeadm-service

# manifests gates
# for day 1: bootstrap/bootstrap_joing will contain kubeadm init/join related step for node named genesis for init and
#            kubeadm join for the rest of the nodes. doesn're require anything else.
#            bootstrap scipt can be up to ~150Kb (in case of perNode is used), that's why the script separated onto
#            dedicated secret for each node, since Secrets have limit 1 - 2Mb and
#            we definetly will go beyond this limit in case of 10-20 nodes.
# for day 2: daemonset perform it bin/bin_helpers/fs_all/fs_ctrl/fs_all_pernode/fs_ctrl_pernode/etc/rbac needed for daemonsets

manifests:
  configmap_bin: true
  secret_daemonset_fs_all: true
  secret_daemonset_fs_ctrl: true
  secret_daemonset_fs_all_pernode: true
  secret_daemonset_fs_ctrl_pernode: true
  secret_bootstrap: false
  daemonset_masters: true
  daemonset_workers: true
  etcd_service: false
  rbac: true

#### BUNDLE CONFIG #####
bundle:
  tpl: {}
    #"sometpl": "hello"
  # Mapping of the manifest to the templates. default is 'override'-templates type
  # those are equialent:
  #
  # <manifest-id>: "<path>"
  # <manifest-id>:
  #   - "override"
  #   - "<path>"
  #
  # Override tries to find if there is a template set in
  # .Values.manifests.tpl.<path>
  # and if found it uses that. if not it fallbacks to
  # to chart existing templates by path $dot.Chart.Name/<path>
  #
  # instead of override it is also possibe to use: tpl, fs and include
  # 1. "tpl" value forces to the template from .Values.manifests.tpl.<path>
  # 2. "fs" value forces to the template accessible by $dot.Chart.Name/<path>
  #    You can use either local chart temlate e.g. templates/<filename>
  #    Or even templates from dependencies e.g.  charts/<dep chart name>/templates/<filename>
  # 3. "include" value is the same as fs, but allows to use path without $dot.Chart.Name prefix
  #     that allows techincally to use and tempalte create with define.
  manifests:
    # ovrd_configmap_apiserver_misc: "templates/_configmap_apiserver_misc.yaml"
    # ovrd_configmap_bin: "templates/_configmap_bin.yaml"
    # ovrd_configmap_certs: "templates/_configmap_certs.yaml"
    # ovrd_configmap_etcd_certs: "templates/_configmap_etcd_certs.yaml"
    # ovrd_configmap_jobs: "templates/_configmap_jobs.yaml"
    # ovrd_configmap_kubeadm: "templates/_configmap_kubeadm.yaml"
    # ovrd_configmap_kubeconfig: "templates/_configmap_kubeconfig.yaml"
    # ovrd_configmap_kubelet: "templates/_configmap_kubelet.yaml"
    # ovrd_configmap_patches: "templates/_configmap_patches.yaml"
    # ovrd_daemonset_masters: "templates/_daemonset_masters.yaml"
    # ovrd_daemonset_workers: "templates/_daemonset_workers.yaml"
    # ovrd_etcd_service: "templates/_etcd_service.yaml"
    # ovrd_rbac: "templates/_rbac.yaml"
# here you can defind overrides for files
#  tpl:
#    <path>: |
#      <template>
# here is a flag which will print some extra comments
#  debug: true

# this is a re-configurable default template - entrypoint of the chart
entrypoint:
  "default": |
    {{ tuple . "templates/phases/_main.tpl" | include "kubeadm.bundle.template" }}
    {{ include "kubeadm.bundle.manifests" . }}

