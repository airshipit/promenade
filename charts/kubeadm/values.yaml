#
# shared config:
#

cluster_config: {}
  # kubeadm uses the version of its binary if it isn't set
  # kubernetesVersion: v1.36.3

#
# modules config:
#

# the directory where the backup phase backs up the certificates of the node,
# a new backup every run. They hold private keys, "backup remove" deletes them.
# The reconcile waits while the directory exists
backup:
  dir: /var/lib/kubeadm-backup

# the scripts run kubeadm, kubelet and kubectl by name, so install_dir has to
# be in the PATH of the node
binaries:
  install_dir: /usr/local/bin
  # the functions installing the binaries on the nodes are binaries.<kind>.sync,
  # tpl strings with their #!define: and #!needs:, they can use the helpers of
  # the binaries module. They return 0 if they changed something and 1 if not,
  # and exit on errors because they are called in && and || lists. The data of
  # a function is next to it
  kubernetes:
    # where kubeadm, kubelet and kubectl come from, a tpl string with ${name} and
    # ${arch} substituted on the node
    url: "https://dl.k8s.io/release/{{ .Values.cluster_config.kubernetesVersion }}/bin/linux/${arch}/${name}"
    # their checksums when there is no <url>.sha256 next to them
    sha256: {}
      # kubeadm: <sha256>
    # binary_kubernetes_sync_rc <name> installs kubeadm, kubelet or kubectl to
    # binaries.install_dir
    sync: |
      #!define: binary_kubernetes_sync_rc
      #!needs: binary_arch, binary_download, binary_replace_rc
      # installs kubeadm, kubelet or kubectl $1 of
      # cluster_config.kubernetesVersion from binaries.kubernetes.url
      binary_kubernetes_sync_rc() {
        local name="$1" version={{ (.Values.cluster_config).kubernetesVersion | default "" | quote }} dst="${ROOTFS}{{ .Values.binaries.install_dir }}/$1" arch url sum="" tmp
        if [ -z "${version}" ]; then
          echo "WARNING: ${name} isn't managed (cluster_config.kubernetesVersion isn't set), the one on the node is used" >&2
          return 1
        fi
        arch=$(binary_arch) || exit 1
        url={{ tpl .Values.binaries.kubernetes.url . | quote }}
        # sums cases go here
        case "${name}" in
      {{- range $name, $sum := .Values.binaries.kubernetes.sha256 | default dict }}
          {{ $name }}) sum={{ $sum | quote }} ;;
      {{- end }}
        esac
        [ -n "${sum}" ] || sum=$(curl -fsSL --retry 5 "${url}.sha256") || exit 1
        # the binary is already there, nothing to download
        if [ -f "${dst}" ] && [ "$(sha256sum < "${dst}" | cut -d ' ' -f 1)" = "${sum}" ]; then
          return 1
        fi
        mkdir -p "${ROOTFS}{{ .Values.binaries.install_dir }}" && tmp=$(mktemp "${ROOTFS}{{ .Values.binaries.install_dir }}/${name}.XXXXXX") || exit 1
        binary_download "${tmp}" "${url}" "${sum}"
        binary_replace_rc "${tmp}" "${name}" || return 1
        echo "${name} is installed from ${url}"
      }
  cri:
    # binary_cri_sync_rc installs the container runtime
    sync: |
      #!define: binary_cri_sync_rc
      # only checks that cri.service is on the node, redefine it to install
      # the runtime
      binary_cri_sync_rc() {
        if ! systemctl cat {{ .Values.cri.service | quote }} > /dev/null 2>&1; then
          echo "the runtime {{ .Values.cri.service }} isn't found: install it on the node" >&2
          exit 1
        fi
        return 1
      }
  etcd:
    # etcdutl and etcdctl of this etcd release, without it the ones on the node
    # are used
    version: ""
    # a tpl string with ${arch} substituted on the node
    url: "https://github.com/etcd-io/etcd/releases/download/{{ .Values.binaries.etcd.version }}/etcd-{{ .Values.binaries.etcd.version }}-linux-${arch}.tar.gz"
    # binary_etcd_sync_rc installs etcdutl and etcdctl
    sync: |
      #!define: binary_etcd_sync_rc
      #!needs: binary_arch, binary_download, binary_replace_rc
      # installs etcdutl and etcdctl of binaries.etcd.version, checked against
      # the SHA256SUMS of the release
      binary_etcd_sync_rc() {
        local version={{ .Values.binaries.etcd.version | quote }} bin="${ROOTFS}{{ .Values.binaries.install_dir }}" arch url sum tmp name changed=1
        if [ -z "${version}" ]; then
          echo "WARNING: etcdutl and etcdctl aren't managed (binaries.etcd.version isn't set), the ones on the node are used" >&2
          return 1
        fi
        if "${bin}/etcdutl" version 2> /dev/null | grep -qw "${version#v}" &&
          "${bin}/etcdctl" version 2> /dev/null | grep -qw "${version#v}"; then
          return 1
        fi
        arch=$(binary_arch) || exit 1
        url={{ tpl .Values.binaries.etcd.url . | quote }}
        sum=$(curl -fsSL --retry 5 "${url%/*}/SHA256SUMS" | awk -v file="${url##*/}" '$2 == file { print $1 }') || exit 1
        [ -n "${sum}" ] || { echo "${url##*/} isn't in ${url%/*}/SHA256SUMS" >&2; exit 1; }
        tmp=$(mktemp -d) || exit 1
        binary_download "${tmp}/etcd.tar.gz" "${url}" "${sum}"
        tar -xzf "${tmp}/etcd.tar.gz" -C "${tmp}" --strip-components=1 || exit 1
        mkdir -p "${bin}" || exit 1
        for name in etcdutl etcdctl; do
          binary_replace_rc "${tmp}/${name}" "${name}" && changed=0
        done
        rm -rf "${tmp}"
        [ "${changed}" -eq 0 ] || return 1
        echo "etcdutl and etcdctl are installed from ${url}"
      }

# here is where all secrets are provided
# 3 options are supported:
# 1. no secrets - assuming that kubeadm will be used to generate everything
# 2. ca key/crt are provided - kubeadm will be used to generate the rest
# 3. all secrets (including etcd) are pregenerated and kubeadm will be used only for
#    certain phases like maintaining manifests
# NOTE: at the moment we don't support external etcd
certs:
  # the pods certs_refresh_clients restarts in this order in all the namespaces
  # after an abrupt CA rotation. The defaults are the ones of kubeadm and of the
  # chart, add the others, e.g. the CNI and the operators
  refresh_clients_selectors:
    - k8s-app=kube-dns
    - k8s-app=kube-proxy
    - component=kubernetes-kubeadm-anchor
    - component=kubernetes-kubeadm-workers-anchor
  # the permissions of the files of the module, see fs.permissions
  permissions:
    # /etc/kubernetes/pki/*
    "pkipriv": # keys
      owner: "root:root"
      mode: "0600"
    "pkipub": # certs
      owner: "root:root"
      mode: "0644"
    # /etc/kubernetes/pki/etcd/*
    "etcdpriv": # keys
      owner: "root:root"
      mode: "0600"
    "etcdpub": # certs
      owner: "root:root"
      mode: "0600" #"0644"
    # /etc/kubernetes/admin/pki/*
    "adminpkipriv": # keys
      owner: "root:root"
      mode: "0600"
    "adminpkipub": # certs
      owner: "root:root"
      mode: "0600" #"0644"

  # ca:
  #   crt: placeholder
  #   key: placeholder

  # sa:
  #   key: placeholder
  #   pub: placeholder
  # ...
  # the certificates of a node:
  # nodes:
  #   <node name>:
  #     etcd_server: {crt, key}
  #     etcd_peer: {crt, key}
  #     kubelet: {crt, key}
  #     # the apiserver certificate of the node with its own SANs, as kubeadm
  #     # issues it. It replaces certs.apiserver shared by all the control
  #     # plane nodes
  #     apiserver: {crt, key}
  # see overrides/test/pki-*.yaml

# the node checks (check_run) and helm test
checks:
  # attempts of the api and certs checks 2 seconds apart, about 5 minutes as
  # the kubeadm timeouts, because on a joining node kubelet pulls the images
  # and starts the haproxy static pod first
  attempts: 150
  # helm test (manifests.helm_test) runs a pod on a control plane node that
  # waits for the anchors and checks the cluster through the API
  helm_test:
    rollout_timeout: 1800s

cri:
  # kubelet starts after it, cri_restart restarts it
  service: containerd.service
  # the configuration of the runtime, synced by cri_sync_rc. The items are as
  # in fs.groups
  fsgroup:
    - path: /etc/containerd
      state: dir
      owner: "root:root"
    - path: /etc/containerd/config.toml
      state: tpl
      from: templates/phases/modules/cri/_containerd_v3.tpl
      owner: "root:root"
      mode: "0600"
  # the credentials of the registries in the containerd configuration of the
  # chart
  # auths:
  #   - repo: registry.example.com
  #     auth: user:password

# the filesystem of the nodes
fs:
  # the permissions of the directories on the node. The files have theirs in
  # <module>.permissions.<group>, where a group is delivered in _<group>/ of the
  # archives (pkipub -> _pkipub/<file>) or is a file itself. Without an entry
  # the owner and the mode aren't changed
  permissions:
    # certs/kubelet
    "/etc/kubernetes/pki":
      owner: "root:root"
      mode: "0700"
    "/etc/kubernetes/pki/etcd":
      owner: "root:root"
      mode: "0700"
    "/etc/kubernetes/admin/pki":
      owner: "root:root"
      mode: "0700"
    "/etc/default":
      owner: "root:root"
    "/etc/systemd/system":
      owner: "root:root"
    "/var/lib/kubelet":
      owner: "root:root"
      mode: "0700"
    "/etc/kubernetes":
      owner: "root:root"
    "/usr/local/sbin":
      owner: "root:root"
    "/etc/kubernetes/kubeadm":
      owner: "root:root"
      mode: "0700"
    "/etc/kubernetes/kubeadm/patches":
      owner: "root:root"
      mode: "0700"
    "/etc/kubernetes/apiserver":
      owner: "root:root"
      mode: "0700"
    # haproxy static pod (vip module) runs as nobody (65534) and reads its
    # config from this directory
    "/etc/kubernetes/kubeadm/addons":
      owner: "root:root"
      mode: "0755"
  # each fs.groups.<group> is synced by the generated fsgroup_<group>_sync_rc
  groups: {}
  # working examples (can be moved to test.sh):
  # groups:
  #   rm_files: #groupname
  #     - path: /usr/local/share/ca/certain/dosntexist
  #       state: "rm"
  #   files:
  #     - path: /usr/local/share/ca/certain
  #       state: "dir" # or touch
  #       owner: "root:root" #optional
  #       mode: "0600" #optional
  #     - path: /usr/local/share/ca/certain2
  #       state: "copy" #  or content or tpl
  #       from: "/usr/local/share/ca/certain/filename"
  #       owner: "root:root" #optional
  #       mode: "0600" #optional

kube_cgroup:
  # the permissions of the files of the module, see fs.permissions
  permissions:
    # in /usr/local/sbin
    "kube-cgroup.sh":
      owner: "root:root"
      mode: "0755"
    # in /etc/systemd/system
    "kube-cgroup.service":
      owner: "root:root"
      mode: "0600"

kubeadm:
  # the permissions of the files of the module, see fs.permissions
  permissions:
    # /etc/kubernetes/kubeadm/*
    "kubeadm":
      owner: "root:root"
      mode: "0600"
    # /etc/kubernetes/kubeadm/patches/*
    "kubeadmpatch":
      owner: "root:root"
      mode: "0600"
    # /etc/kubernetes/apiserver/*
    "kubeadmapiserver":
      owner: "root:root"
      mode: "0600"

kubeconfig:
  clusterName: kubernetes
  controlPlaneEndpoint: 127.0.0.1:6443
  # the permissions of the files of the module, see fs.permissions
  permissions:
    # in /etc/kubernetes
    "admin.conf":
      owner: "root:root"
      mode: "0600"
    "controller-manager.conf":
      owner: "root:root"
      mode: "0600"
    "scheduler.conf":
      owner: "root:root"
      mode: "0600"

kubelet:
  # the permissions of the files of the module, see fs.permissions
  permissions:
    # /etc/kubernetes/pki/*
    "kubeletpkipriv": # keys
      owner: "root:root"
      mode: "0600"
    "kubeletpkipub": # certs
      owner: "root:root"
      mode: "0644"
    # in /etc/kubernetes
    "kubelet.conf":
      owner: "root:root"
      mode: "0600"
    # in /etc/default
    "kubelet":
      owner: "root:root"
      mode: "0600"
    # in /etc/systemd/system
    "kubelet.service":
      owner: "root:root"
      mode: "0600"
    # in /var/lib/kubelet
    "config.yaml":
      owner: "root:root"
      mode: "0600"

# the settings of the operating system kubelet and the runtime need
os:
  # the kernel modules and sysctl, synced by os_sync_rc. The items are as in
  # fs.groups. The runtime needs overlay, the pod network br_netfilter and
  # forwarding
  fsgroup:
    - path: /etc/modules-load.d
      state: dir
      owner: "root:root"
    - path: /etc/modules-load.d/k8s.conf
      state: content
      from: |
        overlay
        br_netfilter
      owner: "root:root"
      mode: "0644"
    - path: /etc/sysctl.d
      state: dir
      owner: "root:root"
    - path: /etc/sysctl.d/k8s.conf
      state: content
      from: |
        net.bridge.bridge-nf-call-iptables  = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        net.ipv4.ip_forward                 = 1
      owner: "root:root"
      mode: "0644"

haproxy:
  container_config_dir: /usr/local/etc/haproxy
  host_config_dir: /etc/kubernetes/kubeadm/addons
  period: 5
  conf_parts:
    global:
      - maxconn 10240
    defaults:
      - timeout connect 5000ms
      - timeout client 24h
      - timeout server 24h
    frontend:
      - mode tcp
    backend:
      - mode tcp
      # the apiserver opens its port before it is ready, so the backends are
      # checked by /readyz, anonymously as the probes of the static pods do. A
      # stopping apiserver fails /readyz, its sessions are closed and the
      # clients such as the kubelet leases go to the others at once
      - option httpchk
      - http-check send meth GET uri /readyz
      - http-check expect status 200
      - default-server check-ssl verify none on-marked-down shutdown-sessions
      - option redispatch

vip:
  # the implementations of the VIP, see the vip module
  modules:
    - haproxy
  # the implementation of the VIP of the node and its argument, a tpl string.
  # The arguments of the vip_sync phase replace them, and the node keeps the
  # ones it was bootstrapped with. For haproxy the argument is
  # "<bind>|<apiserver>,<apiserver>,..."
  init_argname: haproxy
  # init_val: "*:6553|172.29.0.139:6443,172.29.0.144:6443"
  # the permissions of the files of the module, see fs.permissions
  permissions:
    # /etc/kubernetes/manifests/*, the haproxy static pod
    "manifests":
      owner: "root:root"
      mode: "0600"

#
# chart-wide parameters
#

# the admin client certificate issued by cert-manager (manifests.cert_manager_admin),
# kubeadm binds the group kubeadm:cluster-admins to cluster-admin
admin_credentials:
  common_name: kubeadm-parent-admin
  organizations:
    - kubeadm:cluster-admins
  duration: 8760h
  renew_before: 720h

# the Service of etcd
etcd_service:
  name: kubernetes-etcd
  ip: "10.96.0.2"
  service_client:
    enable_node_port: false
    node_port: 32379
    port: 2379
    target_port: 2379

# the daemonsets running the reconcile on the nodes. They can be patched
# with bundle.tpl."templates/_daemonset-masters.yaml.patch" and
# bundle.tpl."templates/_daemonset-workers.yaml.patch" (strategic merge patch)
anchor:
  # service account of the anchor pods and the kubelet restart jobs, created
  # in the release namespace
  service_account: kubeadm
  labels:
    common:
      node_selector_key: kubeadm
      node_selector_value: enabled
    masters:
      node_selector_key: kubernetes-apiserver
      node_selector_value: enabled
  reconcile:
    # seconds between the checks of the chart configuration
    period: 15
    # the directory of the files of the reconcile, such as its script, service
    # account and state, mounted in the pod only
    host_dir: /var/lib/kubeadm-reconcile
    # fails the pass if the values deliver other CA or service account keys
    # than the ones of the node, because the reconcile isn't designed to change
    # the CAs. false is the way out of a wrong guard
    ca_guard: true
    # the anchor becomes ready only after the node checks pass. They check that
    # the VIP follows the apiservers and that the apiserver, etcd and kubelet
    # serve the certificates of their files
    checks: true
    # on the nodes bootstrapped with the haproxy VIP the reconcile loop keeps
    # its config and static pod in sync with the control plane endpoints.
    # Disable it when the VIP is managed by something else (e.g. the haproxy
    # chart)
    vip: true
    # applies swap off, the kernel modules and sysctl of os.fsgroup (os_setup)
    os: true
    # installs and enables the kube-cgroup service (kube_cgroup_setup), the
    # changes take effect on its next start
    kube_cgroup: false
    # installs the runtime with binary_cri_sync_rc
    cri_install: false
    # restarts the runtime when binary_cri_sync_rc or cri.fsgroup changed it
    cri_restart: false
    # kubelet is restarted when its files, its configuration or its binary
    # changed. A job restarts it, the job can be patched with
    # bundle.tpl."templates/phases/modules/reconcile/_job-kubelet-restart.yaml.patch"
    kubelet_restart: true
    # the node is drained before the kubelet restart and uncordoned after it
    kubelet_drain: true

phase_runner:
  compress_fs: tar
  # it's more convenient to debug if it is true
  string_data: false
  # set it to render the script of one node for helm template: the result is
  # always the one Secret <fullname>-phase-runner and no other manifests, with
  # per-node files or without them, so the script is easy to extract
  # nodename: <some node>
  # the profile the phase-runner script runs, one of phase_runner.profiles
  profile: bootstrap
  # the phases of each profile in their order. A phase is a function of a
  # module, the script links only the functions the phases need. "+<phase>"
  # runs only if the command line names it ("-- <phase> <arguments>"), --run
  # runs only the named phases
  profiles:
    # makes the node a node of the cluster, kubeadm init by default and
    # "-- kubeadm_run join ..." to join. cloud-init can run it
    bootstrap:
      # refuses to go on if the values deliver other CA keys than the ones of
      # the node
      - certs_ca_guard
      # the certificates
      - certs_sync
      # the kubeconfigs
      - kubeconfig_sync
      # the certificates and the kubeconfig of kubelet, its unit and
      # configuration
      - kubelet_sync_rc
      # the configurations of kubeadm
      - kubeadm_sync
      # the VIP of the control plane endpoint, the arguments "<implementation>
      # <argument>" replace vip.init_argname and vip.init_val
      - vip_sync
      # swap, the kernel modules and sysctl
      - os_setup
      # the container runtime, restarted if it is changed
      - cri_setup
      # the kube-cgroup service (optional)
      - +kube_cgroup_setup
      # kubeadm, kubectl, kubelet
      - binaries_sync_rc
      # kubelet is (re)started
      - kubelet_start
      # kubeadm with the given arguments (default: init), then the kubelet
      # configuration of the chart again
      - kubeadm_run
      # records the kubelet and kubeadm files the node runs with, so the first
      # pass of the reconcile doesn't apply them again
      - kubelet_mark_applied
      - kubeadm_mark_applied
      # the node checks
      - check_run
      # etcdutl and etcdctl of binaries.etcd on the node (etcd_restore installs
      # them too)
      - +binary_etcd_sync_rc
      # with --run before kubeadm_run: restores etcd of the first control plane
      # node from the snapshot file given as the argument. kubeadm init then
      # needs --ignore-preflight-errors=DirAvailable--var-lib-etcd, the other
      # control plane nodes join as usual
      - +etcd_restore
    # the abrupt CA rotation: the certificates of the values on all the nodes
    # at once, the API alive or not (e.g. an expired CA). With the CAs only in
    # the values kubeadm generates the rest, see
    # overrides/reference/orchestration-ssh-ca.yaml. Deploy this version of the
    # chart first, the anchors of older versions don't wait for it
    rebootstrap:
      # locks the reconcile of the node, the passes going on finish first
      - reconcile_guard
      # backs up the certificates of the node, "restore" puts the last backup
      # back and "remove" deletes the backups once the values are in the
      # cluster, which unlocks the reconcile
      - backup
      # as in bootstrap
      - certs_sync
      - kubeconfig_sync
      - kubelet_sync_rc
      # with the CAs only in the values: regenerates what kubeadm generated
      # from the old CAs, on the workers by the TLS bootstrap of kubelet
      # (KUBEADM_TOKEN). Run it once the control plane runs with the new CAs
      - +certs_generate_with_kubeadm
      # the restart. kubelet stops first, otherwise it creates the static
      # pods again while cri_restart kills the runtime in the middle of it
      - kubelet_stop
      # the static pods of the control plane (crictl stopp), kubelet starts
      # them again
      - static_pods_stop
      - cri_restart
      - kubelet_start
      # records the kubelet files the node runs with, the kubeadm ones aren't
      # applied by the script
      - kubelet_mark_applied
      # the node checks
      - check_run
      # on a control plane node: updates the CA in cluster-info and lets the
      # apiserver create extension-apiserver-authentication again
      - +kubeadm_cluster_info
      # on a control plane node: restarts the pods of
      # certs.refresh_clients_selectors once kube-root-ca.crt of all the
      # namespaces has the new CA
      - +certs_refresh_clients
  # seconds the rebootstrap script waits for the reconcile passes going on on
  # the node (the worst case of the timeouts of a pass and a margin)
  rebootstrap_reconcile_timeout: 2400

# resources prefix
fullnameOverride: kubeadm-service

images:
  tags:
    # only starts the reconcile script on the host: needs a shell with mount,
    # chroot and tar, and nsenter (kubelet restart job); multi-arch
    anchor: docker.io/library/busybox:1.37
    haproxy: docker.io/library/haproxy:3.4.7
    pause: registry.k8s.io/pause:3.10
  pull_policy: "IfNotPresent"

# manifests gates

manifests:
  configmap_bin: true
  secret_daemonset_fs_all: true
  secret_daemonset_fs_ctrl: true
  secret_daemonset_fs_all_pernode: true
  secret_daemonset_fs_ctrl_pernode: true
  secret_phase_runner: false
  # the gen-pki.sh tool as the Secret <fullname>-tools
  secret_tools: false
  # for the release managing the cluster from a parent cluster: the CA as a
  # kubernetes.io/tls Secret <fullname>-ca (e.g. for a cert-manager CA Issuer)
  secret_ca_tls: false
  # the admin client certificate as a kubernetes.io/tls Secret <fullname>-admin
  # (tls.crt, tls.key, ca.crt) the kubeconfig of the parent is built from, one of:
  # - secret_admin_tls: from certs.admin
  # - cert_manager_admin: issued and renewed by cert-manager with the CA of
  #   <fullname>-ca (needs secret_ca_tls or that Secret), see admin_credentials
  secret_admin_tls: false
  cert_manager_admin: false
  daemonset_masters: true
  daemonset_workers: true
  # the test pod of helm test (see checks.helm_test), its script is in the bin ConfigMap
  helm_test: true
  etcd_service: false
  rbac: true

bundle:
  # templates replacing the ones of the chart by their path, e.g.
  # "templates/phases/modules/kubelet/_kubelet-config.yaml": |
  #   <template>
  tpl: {}
  # extra manifests the entrypoint renders unless manifests.<id> is false:
  # <id>: "<path>" or <id>: [<mode>, "<path>"], the mode is one of:
  # 1. override (default) - bundle.tpl.<path> if it is there, the template of
  #    the chart otherwise,
  # 2. tpl - bundle.tpl.<path> only,
  # 3. fs - the template <Chart.Name>/<path>, also of a dependency,
  # 4. include - a named template or a path without the chart name.
  manifests: {}
  # debug: true marks the start and the end of each extra manifest

# this is a re-configurable default template - entrypoint of the chart
entrypoint:
  "default": |
    {{ tuple . "templates/phases/_main.tpl" | include "kubeadm.bundle.template" }}
    {{ include "kubeadm.bundle.manifests" . }}
  "tools": |
    {{ if .Values.manifests.secret_tools }}
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: {{ include "kubeadm.fullname" . }}-tools
    type: Opaque
    data:
      gen-pki.sh: {{ tuple . "templates/phases/modules/certs/_gen-pki.sh.tpl" | include "kubeadm.bundle.template" | b64enc }}
    {{ end }}

# the deprecated features: kept for the upgrades from the previous releases,
# switched off, then removed with their code
deprecated:
  # MIGRATION from Airship: the static pods of a control plane node renamed
  # to the kubeadm ones, the files of Airship removed at the end of the pass.
  # Deprecated: the previous release did it always (without this gate), so
  # the clusters upgraded through it are migrated already; true only for one
  # coming from Airship directly. To be removed with its code
  airship_migration:
    enabled: false
    files_to_delete:
      - /etc/kubernetes/kubelet
      - /etc/kubernetes/controller-manager
      - /etc/kubernetes/scheduler
      - /etc/kubernetes/apiserver/apiserver-proxy-cert.pem
      - /etc/kubernetes/apiserver/apiserver-proxy-key.pem
      - /etc/kubernetes/apiserver/agg-api-ca.pem
      - /etc/kubernetes/apiserver/kubeconfig
      - /etc/kubernetes/apiserver/pki
      - /etc/kubernetes/kubeconfig
      - /etc/kubernetes/pki/cluster-ca.pem
      - /opt/kubernetes/bin/kubelet
  # the preStop hook of the anchor pods of the previous release
  # (/tmp/bin/pre_stop of the bin ConfigMap): they stop their reconcile pass
  # with it when the upgrade replaces them. Deprecated: false once the
  # previous release has the hook inline, then removed with
  # templates/bin/_pre_stop.sh.tpl
  legacy_pre_stop:
    enabled: true
