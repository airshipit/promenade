#
# shared config:
#

cluster_config: {}
  # if not specified - any in accordance to kubeadm version
  # kubernetesVersion: v1.36.3

#
# modules config:
#

# the backups of the certificates of the node made by the backup phase (the
# rebootstrap script), a new one every run: they have the keys, "backup
# remove" removes them
# (the lock of the node: the reconcile script waits while it exists)
backup:
  dir: /var/lib/kubeadm-backup

# kubeadm, kubelet and kubectl: the node scripts run them by name, so install_dir
# has to be in the PATH of the node (the reconcile takes the PATH of the login
# shell of the host). They are installed there by the bootstrap script and kept
# in sync by the anchor if cluster_config.kubernetesVersion is set, otherwise
# the node has them in its PATH. urls are tpl strings, ${ARCH} is substituted
# on the node with its architecture. sha256 is optional, if empty the binary
# is verified with <url>.sha256. The installation procedure can be
# redefined in bundle.tpl."templates/phases/modules/binaries/_install.sh.tpl".
binaries:
  install_dir: /usr/local/bin
  kubeadm:
    url: "https://dl.k8s.io/release/{{ .Values.cluster_config.kubernetesVersion }}/bin/linux/${ARCH}/kubeadm"
    sha256: ""
  kubelet:
    url: "https://dl.k8s.io/release/{{ .Values.cluster_config.kubernetesVersion }}/bin/linux/${ARCH}/kubelet"
    sha256: ""
  kubectl:
    url: "https://dl.k8s.io/release/{{ .Values.cluster_config.kubernetesVersion }}/bin/linux/${ARCH}/kubectl"
    sha256: ""

# here is where all secrets are provided
# 3 options are supported:
# 1. no secrets - assuming that kubadm will be used to generate everything
# 2. ca key/crt are provided - kubeadm will be used to generate the rest
# 3. all secrets (including etcd) are pregenerated and kubeadm will be used only only for
#    certain phases like maintaining manifests
# NOTE: at the moment we don't support external etcd
certs:
  # the permissions of the files of the phase (see fs.permissions)
  permissions:
    # /etc/kubernetes/pki
    "pkipriv": # keys
      owner: "root:root"
      mode: "0600"
    "pkipub": # certs
      owner: "root:root"
      mode: "0644"
    # /etc/kubernetes/pki/etcd
    "etcdpriv": # keys
      owner: "root:root"
      mode: "0600"
    "etcdpub": # certs
      owner: "root:root"
      mode: "0600" #"0644"
    # /etc/kubernetes/admin/pki
    "adminpkipriv": # keys
      owner: "root:root"
      mode: "0600"
    "adminpkipub": # certs
      owner: "root:root"
      mode: "0600" #"0644"

  # ca:
  #   crt: placeholder
  #   key: placeholder

  # sa:
  #   key: placeholder
  #   pub: placeholder
  # ...
  # the certificates of a node:
  # nodes:
  #   <node name>:
  #     etcd_server: {crt, key}
  #     etcd_peer: {crt, key}
  #     kubelet: {crt, key}
  #     # the API of the node (its own SANs, as kubeadm issues it), either this
  #     # one for every control plane node or apiserver above shared by all of
  #     # them: with both, the one of the node wins
  #     apiserver: {crt, key}
  # see overrides/test/pki-*.yaml

# node checks: one line per check "check OK|FAIL|SKIP <check> <details>",
# the checks fail if any check failed. Day 0/1: the check_run phase of the
# bootstrap and rebootstrap profiles (bootstrap.profiles), /livez through
# kubeconfig.controlPlaneEndpoint
checks:
  # day 2, by the reconcile before the anchor becomes ready (it restarts): the
  # first pass of the haproxy VIP reconcile (vip.reconcile), the reconcile loop
  # ignores its errors; the apiserver, etcd and kubelet of the node serve the
  # certificates of its files (they reload them, checks.attempts)
  reconcile: true
  # attempts 2 seconds apart of the api and certs checks (about 5 minutes, as
  # the kubeadm timeouts): on a joining node kubelet pulls the images and starts
  # the haproxy static pod of the VIP first
  attempts: 150
  # helm test (manifests.helm_test): a pod on a control plane node waits for the
  # anchors and checks the cluster through the API
  helm_test:
    rollout_timeout: 1800s

cri:
  # kubelet starts after it, cri_restart restarts it
  service: containerd.service
  # the bootstrap script always runs cri_install_sync_rc, the reconcile script
  # with this flag. The installation procedure can be redefined in
  # bundle.tpl."templates/phases/modules/cri/_install.sh.tpl".
  reconcile_install: false
  # the reconcile script restarts the runtime when cri_install_sync_rc or
  # cri.fsgroup changed it, the bootstrap script always does
  restart: false
  # the configuration of the runtime, synced by cri_sync_rc (the items as in files)
  fsgroup:
    - path: /etc/containerd
      state: dir
      owner: "root:root"
    - path: /etc/containerd/config.toml
      state: tpl
      from: templates/phases/modules/cri/_containerd_v3.tpl
      owner: "root:root"
      mode: "0600"
  # auths:
  #   - repo: docker-open-nc.zc1.somedomain.com
  #     auth: user:password

# the filesystem of the nodes
fs:
  # the permissions on the node of the directories of the phases, the files
  # have theirs in the values of the phase: <phase>.permissions.<group>, a group
  # is delivered in _<group>/ of the archives (pkipub -> _pkipub/<file>) or is a
  # file itself. If there is no data, empty owner and mode are passed and setting
  # of permissions is skipped in that case.
  permissions:
    # certs/kubelet
    "/etc/kubernetes/pki":
      owner: "root:root"
      mode: "0700"
    "/etc/kubernetes/pki/etcd":
      owner: "root:root"
      mode: "0700"
    "/etc/kubernetes/admin/pki":
      owner: "root:root"
      mode: "0700"
    "/etc/default":
      owner: "root:root"
    "/etc/systemd/system":
      owner: "root:root"
    "/var/lib/kubelet":
      owner: "root:root"
      mode: "0700"
    "/etc/kubernetes":
      owner: "root:root"
    "/usr/local/sbin":
      owner: "root:root"
    "/etc/kubernetes/kubeadm":
      owner: "root:root"
      mode: "0700"
    "/etc/kubernetes/kubeadm/patches":
      owner: "root:root"
      mode: "0700"
    "/etc/kubernetes/apiserver":
      owner: "root:root"
      mode: "0700"
    # haproxy static pod (vip phase) runs as nobody (65534) and reads its
    # config from this directory
    "/etc/kubernetes/kubeadm/addons":
      owner: "root:root"
      mode: "0755"
  # the groups: fs.groups.<group> is synced by fsgroup_<group>_sync_rc
  groups: {}
  # working examples (can be moved to test.sh):
  # groups:
  #   rm_files: #groupname
  #     - path: /usr/local/share/ca/certain/dosntexist
  #       state: "rm"
  #   files:
  #     - path: /usr/local/share/ca/certain
  #       state: "dir" # or touch
  #       owner: "root:root" #optional
  #       mode: "0600" #optional
  #     - path: /usr/local/share/ca/certain2
  #       state: "copy" #  or content or tpl
  #       from: "/usr/local/share/ca/certain/filename"
  #       owner: "root:root" #optional
  #       mode: "0600" #optional

kube_cgroup:
  # the permissions of the files of the phase (see fs.permissions)
  permissions:
    # /usr/local/sbin
    "kube-cgroup.sh":
      owner: "root:root"
      mode: "0600"
    # /etc/systemd/system
    "kube-cgroup.service":
      owner: "root:root"
      mode: "0600"

kubeadm:
  # the permissions of the files of the phase (see fs.permissions)
  permissions:
    # /etc/kubernetes/kubeadm
    "kubeadm":
      owner: "root:root"
      mode: "0600"
    # /etc/kubernetes/kubeadm/patches
    "kubeadmpatch":
      owner: "root:root"
      mode: "0600"
    # /etc/kubernetes/apiserver
    "kubeadmapiserver":
      owner: "root:root"
      mode: "0600"

kubeconfig:
  clusterName: kubernetes
  controlPlaneEndpoint: 127.0.0.1:6443
  # the permissions of the files of the phase (see fs.permissions)
  permissions:
    # /etc/kubernetes
    "admin.conf":
      owner: "root:root"
      mode: "0600"
    "controller-manager.conf":
      owner: "root:root"
      mode: "0600"
    "scheduler.conf":
      owner: "root:root"
      mode: "0600"

kubelet:
  restart: true
  # the node is drained before the restart and uncordoned after it
  drain: true
  # the job restarting kubelet can be patched with
  # bundle.tpl."templates/phases/modules/kubelet/_job-kubelet-restart.yaml.patch"
  # the permissions of the files of the phase (see fs.permissions)
  permissions:
    # /etc/kubernetes/pki
    "kubeletpkipriv": # keys
      owner: "root:root"
      mode: "0600"
    "kubeletpkipub": # certs
      owner: "root:root"
      mode: "0644"
    # /etc/kubernetes
    "kubelet.conf":
      owner: "root:root"
      mode: "0600"
    # /etc/default
    "kubelet":
      owner: "root:root"
      mode: "0600"
    # /etc/systemd/system
    "kubelet.service":
      owner: "root:root"
      mode: "0600"
    # /var/lib/kubelet
    "config.yaml":
      owner: "root:root"
      mode: "0600"

haproxy:
  container_config_dir: /usr/local/etc/haproxy
  host_config_dir: /etc/kubernetes/kubeadm/addons
  period: 5
  conf_parts:
    global:
      - maxconn 10240
    defaults:
      - timeout connect 5000ms
      - timeout client 24h
      - timeout server 24h
    frontend:
      - mode tcp
    backend:
      - mode tcp
      # the apiserver opens its port before it is ready: /readyz (anonymous,
      # as the probes of the static pods), not the port only. A stopping
      # apiserver fails /readyz: its sessions are closed, the clients (kubelet
      # leases) go to the others at once
      - option httpchk
      - http-check send meth GET uri /readyz
      - http-check expect status 200
      - default-server check-ssl verify none on-marked-down shutdown-sessions
      - option redispatch

vip:
  # the implementations of the VIP: templates/phases/modules/vip/_<module>.tpl
  modules:
    - haproxy
  # the VIP of the node: the implementation and its argument (a tpl string),
  # the arguments of the vip_sync phase replace them, saved on the node by the
  # first phase using the VIP, e.g.
  # haproxy: "<bind>|<apiserver>,<apiserver>,..."
  init_argname: haproxy
  # init_val: "*:6553|172.29.0.139:6443,172.29.0.144:6443"
  # day 2: on the nodes bootstrapped with the haproxy VIP the reconcile loop
  # keeps its config and static pod in sync with the control plane endpoints.
  # Disable it when the VIP is managed by something else (e.g. the haproxy chart)
  reconcile: true
  # the permissions of the files of the phase (see fs.permissions)
  permissions:
    # /etc/kubernetes/manifests, the haproxy static pod
    "manifests":
      owner: "root:root"
      mode: "0600"

#
# chart-wide parameters
#

# the admin client certificate issued by cert-manager (manifests.cert_manager_admin),
# kubeadm binds the group kubeadm:cluster-admins to cluster-admin
admin_credentials:
  common_name: kubeadm-parent-admin
  organizations:
    - kubeadm:cluster-admins
  duration: 8760h
  renew_before: 720h

# the Service of etcd params
etcd_service:
  name: kubernetes-etcd
  ip: "10.96.0.2"
  service_client:
    enable_node_port: false
    node_port: 32379
    port: 2379
    # TODO: must match with kubeadm.settings.etcd_servers ports
    target_port: 2379

# daemonsets running the reconcile script (day 2) on the nodes, they can be
# patched with bundle.tpl."templates/_daemonset-masters.yaml.patch" and
# bundle.tpl."templates/_daemonset-workers.yaml.patch" (strategic merge patch)
anchor:
  # service account of the anchor pods and the kubelet restart jobs, created
  # in the release namespace
  service_account: kubeadm
  labels:
    common:
      node_selector_key: kubeadm
      node_selector_value: enabled
    masters:
      node_selector_key: kubernetes-apiserver
      node_selector_value: enabled
  reconcile:
    # seconds between the checks of the chart configuration
    period: 15
    # its own files (script, service account, state), mounted in the pod only
    host_dir: /var/lib/kubeadm-reconcile
    # refuse to replace the CA keys (Kubernetes, etcd, front proxy) and the
    # service account key on a node which already has different ones: the
    # certificates of the node are signed with them. The CAs are rotated by
    # the rebootstrap; false is the way out of a wrong guard (the bootstrap
    # runs without it with --run and its other phases)
    ca_guard: true

bootstrap:
  compress_fs: tar
  # it's more convenient to debug if it is true
  string_data: false
  # in case there is per-node data the next field can be used to generate only script for 1 node so
  # it is easier to extract. in that case only 1 secret will be generated with the name {{ include "kubeadm.fullname" $envAll }}-bootstrap
  # without suffix-<nodename>. Using this parameter disables producing other manifests generated in _main.tpl to help sed find the needed field only.
  # this is because we assume that bootstrap.nodename is used only for manual helm template execution
  # nodename: <some node>
  # the profile of the script of the bootstrap Secrets
  # (templates/bin/_bootstrap.tpl): it runs the phases of
  # bootstrap.profiles.<profile>
  profile: bootstrap
  # the phases of the script in their order: a phase is a function of
  # templates/phases, the script is linked from them, only the functions they
  # need (templates/lib/_linker.tpl). "+<phase>" runs only if the command line
  # names it ("-- <phase> <arguments>"), --run runs the named ones only
  # (templates/phases/_phase_runner.tpl)
  profiles:
    # makes a node a node of the cluster with the files of the values: kubeadm
    # init (kubeadm join: "-- kubeadm_run join ..."), it can be called by
    # cloud-init
    bootstrap:
      # refuses to go on if the values deliver other CA keys than the ones of
      # the node
      - certs_guard_ca
      # the certificates
      - certs_sync
      # the kubeconfigs
      - kubeconfigs_sync
      # the certificates and the kubeconfig of kubelet, its unit and
      # configuration
      - kubelet_sync_rc
      # the configurations of kubeadm
      - kubeadm_sync
      # the VIP of the control plane endpoint, the arguments "<implementation>
      # <argument>" save the VIP of the node (vip.init_argname, vip.init_val
      # by default)
      - vip_sync
      # the container runtime, restarted if it is changed
      - cri_setup
      # the kube-cgroup service
      - kube_cgroup_sync
      # kubeadm, kubectl, kubelet
      - binaries_sync
      # swap, the kernel modules and sysctl
      - k8s_up
      # kubelet is (re)started
      - kubelet_start
      # kubeadm with the arguments of the phase (init by default), then the
      # configuration of kubelet of the chart again
      - kubeadm_run
      # the node with the configurations it runs with: the first pass of the
      # reconcile doesn't apply them again
      - annotate_applied_configs
      # the node checks (templates/phases/modules/checks/_.tpl)
      - check_run
    # the certificates of the values again on the nodes of an existing cluster,
    # its API alive or not (recovery from an expired CA, abrupt CA rotation),
    # on all the nodes at once. The certificates are pregenerated or, with the
    # CAs only, generated by kubeadm: the orchestration selects the phases
    # (overrides/reference/ssh-orchestration-ca.yaml). No CA guard: changing
    # the CA is what it is for
    rebootstrap:
      # the anchors of the node wait while the backups exist (backup.dir, the
      # lock), the reconcile passes going on finish first
      - reconcile_guard
      # the certificates of the node to a new backup in backup.dir; with
      # "restore": the certificates from the last backup, then the restart
      # phases again; with "remove": all the backups (they have the keys) once
      # the values are in the cluster, the anchors go on
      - backup
      # as in bootstrap
      - certs_sync
      - kubeconfigs_sync
      - kubelet_sync_rc
      # the values have the CAs only: what kubeadm generated from the CAs
      # again, its certificates and kubeconfigs on the control plane nodes, the
      # TLS bootstrap of kubelet on the workers (KUBEADM_TOKEN), once the
      # control plane runs with the new CAs
      - +kubeadm_certs
      # the static pods of the control plane (crictl stopp), kubelet starts
      # them again
      - static_pods_stop
      # the restart
      - kubelet_stop
      # TODO: the reference procedure restarts the runtime, find out why (its history)
      - cri_restart
      - kubelet_start
      # the node with the configuration of kubelet it runs with (not the
      # kubeadm one: the script doesn't apply it)
      - annotate_applied_kubelet
      # the node checks
      - check_run
      # on a control plane node: the CA of the cluster-info ConfigMap (kubeadm
      # creates it only), extension-apiserver-authentication is removed (the
      # apiserver creates it with the new CAs)
      - +kubeadm_cluster_info
      # on a control plane node: the pods of
      # bootstrap.rebootstrap_restart_selectors are deleted once
      # kube-root-ca.crt of all the namespaces has the new CA, they keep the CA
      # and the service account tokens of the old ones
      - +restart_clients
  # seconds the rebootstrap script waits for the reconcile passes going on on
  # the node (the worst case of the timeouts of a pass and a margin)
  rebootstrap_reconcile_timeout: 2400
  # the rebootstrap restart_clients phase deletes the pods of these selectors in
  # this order (all the namespaces): they keep the CA and the service account
  # tokens of the old ones. The ones of kubeadm and of the chart, the values
  # add the others (the CNI, the operators...)
  rebootstrap_restart_selectors:
    - k8s-app=kube-dns
    - k8s-app=kube-proxy
    - component=kubernetes-kubeadm-anchor
    - component=kubernetes-kubeadm-workers-anchor

# resources prefix
fullnameOverride: kubeadm-service

images:
  tags:
    # only starts the reconcile script on the host: needs a shell with mount,
    # chroot and tar, and nsenter (kubelet restart job); multi-arch
    anchor: docker.io/library/busybox:1.37
    haproxy: docker.io/library/haproxy:3.4.7
    pause: registry.k8s.io/pause:3.10
  pull_policy: "IfNotPresent"

# manifests gates
# for day 1: bootstrap.sh will contain kubeadm init/join related step for node named genesis for init and
#            kubeadm join for the rest of the nodes. doesn're require anything else.
#            bootstrap scipt can be up to ~150Kb (in case of perNode is used), that's why the script separated onto
#            dedicated secret for each node, since Secrets have limit 1 - 2Mb and
#            we definetly will go beyond this limit in case of 10-20 nodes.
# for day 2: daemonset perform it bin/bin_helpers/fs_all/fs_ctrl/fs_all_pernode/fs_ctrl_pernode/etc/rbac needed for daemonsets

manifests:
  configmap_bin: true
  secret_daemonset_fs_all: true
  secret_daemonset_fs_ctrl: true
  secret_daemonset_fs_all_pernode: true
  secret_daemonset_fs_ctrl_pernode: true
  secret_bootstrap: false
  # for the release managing the cluster from a parent cluster: the CA as a
  # kubernetes.io/tls Secret <fullname>-ca (e.g. for a cert-manager CA Issuer)
  secret_ca_tls: false
  # the admin client certificate as a kubernetes.io/tls Secret <fullname>-admin
  # (tls.crt, tls.key, ca.crt) the kubeconfig of the parent is built from, one of:
  # - secret_admin_tls: from certs.admin
  # - cert_manager_admin: issued and renewed by cert-manager with the CA of
  #   <fullname>-ca (needs secret_ca_tls or that Secret), see admin_credentials
  secret_admin_tls: false
  cert_manager_admin: false
  daemonset_masters: true
  daemonset_workers: true
  # the test pod of helm test (see checks.helm_test), its script is in the bin ConfigMap
  helm_test: true
  etcd_service: false
  rbac: true

bundle:
  tpl: {}
    #"sometpl": "hello"
  # Mapping of the manifest to the templates. default is 'override'-templates type
  # those are equialent:
  #
  # <manifest-id>: "<path>"
  # <manifest-id>:
  #   - "override"
  #   - "<path>"
  #
  # Override tries to find if there is a template set in
  # .Values.manifests.tpl.<path>
  # and if found it uses that. if not it fallbacks to
  # to chart existing templates by path $dot.Chart.Name/<path>
  #
  # instead of override it is also possibe to use: tpl, fs and include
  # 1. "tpl" value forces to the template from .Values.manifests.tpl.<path>
  # 2. "fs" value forces to the template accessible by $dot.Chart.Name/<path>
  #    You can use either local chart temlate e.g. templates/<filename>
  #    Or even templates from dependencies e.g.  charts/<dep chart name>/templates/<filename>
  # 3. "include" value is the same as fs, but allows to use path without $dot.Chart.Name prefix
  #     that allows techincally to use and tempalte create with define.
  manifests:
    # ovrd_configmap_apiserver_misc: "templates/_configmap_apiserver_misc.yaml"
    # ovrd_configmap_bin: "templates/_configmap_bin.yaml"
    # ovrd_configmap_certs: "templates/_configmap_certs.yaml"
    # ovrd_configmap_etcd_certs: "templates/_configmap_etcd_certs.yaml"
    # ovrd_configmap_jobs: "templates/_configmap_jobs.yaml"
    # ovrd_configmap_kubeadm: "templates/_configmap_kubeadm.yaml"
    # ovrd_configmap_kubeconfig: "templates/_configmap_kubeconfig.yaml"
    # ovrd_configmap_kubelet: "templates/_configmap_kubelet.yaml"
    # ovrd_configmap_patches: "templates/_configmap_patches.yaml"
    # ovrd_daemonset_masters: "templates/_daemonset_masters.yaml"
    # ovrd_daemonset_workers: "templates/_daemonset_workers.yaml"
    # ovrd_etcd_service: "templates/_etcd_service.yaml"
    # ovrd_rbac: "templates/_rbac.yaml"
# here you can defind overrides for files
#  tpl:
#    <path>: |
#      <template>
# here is a flag which will print some extra comments
#  debug: true

# this is a re-configurable default template - entrypoint of the chart
entrypoint:
  "default": |
    {{ tuple . "templates/phases/_main.tpl" | include "kubeadm.bundle.template" }}
    {{ include "kubeadm.bundle.manifests" . }}
  "tools": |
    {{ if .Values.manifests.secret_tools }}
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: {{ include "kubeadm.fullname" . }}-tools
    type: Opaque
    data:
      gen-pki.sh: {{ tuple . "templates/phases/modules/tools/_gen-pki.sh.tpl" | include "kubeadm.bundle.template" | b64enc }}
    {{ end }}

# the deprecated features: kept for the upgrades from the previous releases,
# switched off, then removed with their code
deprecated:
  # MIGRATION from Airship: the static pods of a control plane node renamed
  # to the kubeadm ones, the files of Airship removed at the end of the pass.
  # Deprecated: the previous release did it always (without this gate), so
  # the clusters upgraded through it are migrated already; true only for one
  # coming from Airship directly. To be removed with its code
  airship_migration:
    enabled: false
    files_to_delete:
      - /etc/kubernetes/kubelet
      - /etc/kubernetes/controller-manager
      - /etc/kubernetes/scheduler
      - /etc/kubernetes/apiserver/apiserver-proxy-cert.pem
      - /etc/kubernetes/apiserver/apiserver-proxy-key.pem
      - /etc/kubernetes/apiserver/agg-api-ca.pem
      - /etc/kubernetes/apiserver/kubeconfig
      - /etc/kubernetes/apiserver/pki
      - /etc/kubernetes/kubeconfig
      - /etc/kubernetes/pki/cluster-ca.pem
      - /opt/kubernetes/bin/kubelet
  # the preStop hook of the anchor pods of the previous release
  # (/tmp/bin/pre_stop of the bin ConfigMap): they stop their reconcile pass
  # with it when the upgrade replaces them. Deprecated: false once the
  # previous release has the hook inline, then removed with
