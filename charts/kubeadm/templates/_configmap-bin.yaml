{{/* Note: this file is called from templates/phases/_main.tpl and mainDict contains lots of cached info */}}
{{- $envAll := index . 0 -}}
{{- $mainDict := index . 1 -}}

{{- if $envAll.Values.manifests.configmap_bin }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeadm.fullname" $envAll }}-bin
data:
  reconcile: |+
{{ tuple $envAll "templates/bin/_reconcile.sh.tpl" (tuple $envAll $mainDict) | include "kubeadm.bundle.template" | indent 4 }}
  test: |+
{{ tuple $envAll "templates/bin/_test.sh.tpl" | include "kubeadm.bundle.template" | indent 4 }}
{{- if $envAll.Values.deprecated.legacy_pre_stop.enabled }}
  # run by the pods of the previous chart versions, the new ones have it inline
  pre_stop: |+
{{ tuple $envAll "templates/bin/_pre_stop.sh.tpl" | include "kubeadm.bundle.template" | indent 4 }}
{{- end }}
{{- end }}
