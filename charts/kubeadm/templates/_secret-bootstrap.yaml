{{/* Note: this file is called from templates/phases/_main.tpl and k8sConfDict contains lots of cached info */}}
{{- $envAll := index . 0 -}}
{{- $k8sConfDict := index . 1 -}}

{{- if $envAll.Values.manifests.secret_bootstrap -}}

{{/* if perNode is empty - we have only differente per role and we can one secret */}}
{{- if not (hasKey $k8sConfDict "perNode") }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeadm.fullname" $envAll }}-bootstrap
type: Opaque
{{ $content := tuple $envAll "templates/bin/_bootstrap.tpl" (tuple $envAll $k8sConfDict "") | include "kubeadm.bundle.template"  -}}
{{- if $envAll.Values.bootstrap.string_data }}
stringData:
  script: |
{{ $content | indent 4 }}
{{ else }}
data:
  script: {{ $content | b64enc }}
{{ end }}

{{ else -}}
{{/*single nodename filter*/}}
{{- $nodenameFilter := $envAll.Values.bootstrap.nodename | default "" -}}
{{- $perNode := get $k8sConfDict "perNode" -}}
{{- range $nodeName,$_ := $perNode -}}
{{- if or (eq $nodenameFilter "") (eq $nodenameFilter $nodeName) }}

---
apiVersion: v1
kind: Secret
metadata:
{{ if not (eq $nodenameFilter "") }}
  name: {{ include "kubeadm.fullname" $envAll }}-bootstrap
{{ else }}
  name: {{ include "kubeadm.fullname" $envAll }}-bootstrap-{{ $nodeName }}
{{ end }}
type: Opaque
{{ $content := tuple $envAll "templates/bin/_bootstrap.tpl" (tuple $envAll $k8sConfDict $nodeName) | include "kubeadm.bundle.template" -}}
{{- if $envAll.Values.bootstrap.string_data }}
stringData:
  script: |
{{ $content | indent 4 }}
{{ else }}
data:
  script: {{ $content | b64enc }}
{{ end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- end -}}