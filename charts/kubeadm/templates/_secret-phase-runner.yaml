{{/* Note: this file is called from templates/phases/_main.tpl and mainDict contains lots of cached info */}}
{{- $envAll := index . 0 -}}
{{- $mainDict := index . 1 -}}

{{- if $envAll.Values.manifests.secret_phase_runner -}}

{{/* the script runs the phases of phase_runner.profile */}}
{{- $script := "templates/bin/_run_phases.sh.tpl" -}}

{{/* without per-node files the nodes differ by the role only, so one Secret
     serves all of them */}}
{{- if not (hasKey $mainDict "perNode") }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeadm.fullname" $envAll }}-phase-runner
type: Opaque
{{ $content := tuple $envAll $script (tuple $envAll $mainDict "") | include "kubeadm.bundle.template"  -}}
{{- if $envAll.Values.phase_runner.string_data }}
stringData:
  script: |
{{ $content | indent 4 }}
{{ else }}
data:
  script: {{ $content | b64enc }}
{{ end }}

{{ else -}}
{{/* the script can be ~150Kb with per-node files: one Secret per node, one
     for all of them would go beyond the size limit with 10-20 nodes */}}
{{- $nodenameFilter := $envAll.Values.phase_runner.nodename | default "" -}}
{{- $perNode := get $mainDict "perNode" -}}
{{- range $nodeName,$_ := $perNode -}}
{{- if or (eq $nodenameFilter "") (eq $nodenameFilter $nodeName) }}

---
apiVersion: v1
kind: Secret
metadata:
{{ if not (eq $nodenameFilter "") }}
  name: {{ include "kubeadm.fullname" $envAll }}-phase-runner
{{ else }}
  name: {{ include "kubeadm.fullname" $envAll }}-phase-runner-{{ $nodeName }}
{{ end }}
type: Opaque
{{ $content := tuple $envAll $script (tuple $envAll $mainDict $nodeName) | include "kubeadm.bundle.template" -}}
{{- if $envAll.Values.phase_runner.string_data }}
stringData:
  script: |
{{ $content | indent 4 }}
{{ else }}
data:
  script: {{ $content | b64enc }}
{{ end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- end -}}