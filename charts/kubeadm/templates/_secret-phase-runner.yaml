{{/* Note: this file is called from templates/phases/_main.tpl and k8sConfDict contains lots of cached info */}}
{{- $envAll := index . 0 -}}
{{- $k8sConfDict := index . 1 -}}

{{- if $envAll.Values.manifests.secret_phase_runner -}}

{{/* the script of the Secrets, the phases of phase_runner.profile */}}
{{- $script := "templates/bin/_run_phases.sh.tpl" -}}

{{/* without per-node files the nodes differ by the role only: one Secret for all of them */}}
{{- if not (hasKey $k8sConfDict "perNode") }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeadm.fullname" $envAll }}-phase-runner
type: Opaque
{{ $content := tuple $envAll $script (tuple $envAll $k8sConfDict "") | include "kubeadm.bundle.template"  -}}
{{- if $envAll.Values.phase_runner.string_data }}
stringData:
  script: |
{{ $content | indent 4 }}
{{ else }}
data:
  script: {{ $content | b64enc }}
{{ end }}

{{ else -}}
{{/*single nodename filter*/}}
{{- $nodenameFilter := $envAll.Values.phase_runner.nodename | default "" -}}
{{- $perNode := get $k8sConfDict "perNode" -}}
{{- range $nodeName,$_ := $perNode -}}
{{- if or (eq $nodenameFilter "") (eq $nodenameFilter $nodeName) }}

---
apiVersion: v1
kind: Secret
metadata:
{{ if not (eq $nodenameFilter "") }}
  name: {{ include "kubeadm.fullname" $envAll }}-phase-runner
{{ else }}
  name: {{ include "kubeadm.fullname" $envAll }}-phase-runner-{{ $nodeName }}
{{ end }}
type: Opaque
{{ $content := tuple $envAll $script (tuple $envAll $k8sConfDict $nodeName) | include "kubeadm.bundle.template" -}}
{{- if $envAll.Values.phase_runner.string_data }}
stringData:
  script: |
{{ $content | indent 4 }}
{{ else }}
data:
  script: {{ $content | b64enc }}
{{ end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- end -}}