{{- if .Values.manifests.rbac }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.anchor.service_account }}
  namespace: {{ .Release.Namespace }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kubeadm.fullname" . }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - pods/eviction
    verbs:
      - "*"
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - "*"
  - apiGroups:
      - ""
      - apps
    resources:
      - daemonsets
    verbs:
      - "*"
  # the haproxy VIP follows the apiservers (vip_anchor)
  - apiGroups: [ "discovery.k8s.io" ]
    resources: [ "endpointslices" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "batch" ]
    resources: [ "jobs" ]
    verbs:
      # note:
      # - "*" causes kubectl wait command to return forbidden:
      # User \"system:serviceaccount:kube-system:kubeadm\" cannot watch resource \"jobs\" in API group \"batch\" in the namespace \"kube-system\"" reflector="k8s.io/client-go/tools/watch/informerwatcher.go:162" type="*unstructured.Unstructured"
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kubeadm.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.anchor.service_account }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "kubeadm.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
