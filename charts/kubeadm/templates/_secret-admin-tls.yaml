{{/* the admin client certificate of certs.admin as a kubernetes.io/tls Secret,
     the same Secret as the one cert-manager issues (_cert-manager-admin.yaml):
     the kubeconfig of a parent cluster is built from it */}}
{{- $envAll := . -}}

{{- if $envAll.Values.manifests.secret_admin_tls }}
{{- if $envAll.Values.manifests.cert_manager_admin }}
{{- fail "manifests.secret_admin_tls and manifests.cert_manager_admin produce the same Secret, enable one of them" }}
{{- end }}
{{- $certs := $envAll.Values.certs | default dict }}
{{- $ca := get $certs "ca" | default dict }}
{{- $admin := get $certs "admin" | default dict }}
{{- if not (and $admin.crt $admin.key $ca.crt) }}
{{- fail "manifests.secret_admin_tls needs certs.admin.crt, certs.admin.key and certs.ca.crt" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeadm.fullname" $envAll }}-admin
type: kubernetes.io/tls
data:
  tls.crt: {{ $admin.crt | b64enc }}
  tls.key: {{ $admin.key | b64enc }}
  ca.crt: {{ $ca.crt | b64enc }}
{{- end }}
