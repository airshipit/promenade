{{/* Note: this file is called from templates/phases/_main.tpl and k8sConfDict contains lots of cached info */}}
{{- $envAll := index . 0 -}}
{{- $k8sConfDict := index . 1 -}}
{{- $labels := tuple $envAll "kubernetes" "kubernetes-kubeadm-anchor" | include "kubeadm.labels" -}}

apiVersion: "apps/v1"
kind: DaemonSet
metadata:
  name: {{ include "kubeadm.fullname" $envAll }}-masters-anchor
  labels:
{{ $labels | indent 4 }}
  annotations:
spec:
  selector:
    matchLabels:
{{ $labels | indent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
{{ $labels | indent 8 }}
      annotations:
        configmap-bin-hash: {{ tuple $envAll "templates/_configmap-bin.yaml" (tuple $envAll $k8sConfDict) | include "kubeadm.bundle.template" | sha256sum | quote }}
        secret-daemonset_fs-hash: {{ tuple $envAll "templates/_secret-daemonset-fs.yaml" (tuple $envAll $k8sConfDict) | include "kubeadm.bundle.template" | sha256sum | quote }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ $envAll.Values.anchor.labels.common.node_selector_key }}
                    operator: In
                    values:
                      - {{ $envAll.Values.anchor.labels.common.node_selector_value }}
                  - key: {{ $envAll.Values.anchor.labels.masters.node_selector_key }}
                    operator: In
                    values:
                      - {{ $envAll.Values.anchor.labels.masters.node_selector_value }}
      dnsPolicy: Default
      serviceAccountName: {{ $envAll.Values.anchor.service_account }}
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        # hostNetwork: no need to wait for the CNI, reconcile can fix a NotReady node
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists
      terminationGracePeriodSeconds: 3600
      containers:
        - name: anchor
          image: {{ $envAll.Values.images.tags.anchor }}
          imagePullPolicy: {{ $envAll.Values.images.pull_policy }}
          # mounts (tmpfs, service account) on the host paths in the pod, see
          # templates/bin/_ensure_fs.tpl
          securityContext:
            privileged: true
          env:
          - name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: NODE_ROLE
            value: "master"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          command:
            - /bin/sh
            - -c
            - |
              # account for images that may not have pipefail in sh
              if (set -o pipefail) 2>/dev/null; then set -o pipefail; fi
              { /tmp/bin/ensure_fs && exec chroot /host /bin/bash {{ $envAll.Values.anchor.reconcile.host_dir }}/bin/reconcile; } 2>&1 | tee "/host/var/log/kubeadm_output_$(date +%Y%m%d_%H%M%S).log"
          lifecycle:
            preStop:
              exec:
                # inline: a running pod keeps the hook of its own reconcile
                command:
                  - /bin/sh
                  - -c
                  - |
                    touch /host{{ $envAll.Values.anchor.reconcile.host_dir }}/stop
                    # the script stops between its passes; terminationGracePeriodSeconds limits the wait
                    while pgrep -f "{{ $envAll.Values.anchor.reconcile.host_dir }}/bin/reconcile" > /dev/null; do
                      sleep 1
                    done

          readinessProbe:
            exec:
              command:
              - cat
              - /host{{ $envAll.Values.anchor.reconcile.host_dir }}/done

          volumeMounts:
            - name: host
              mountPath: /host
              mountPropagation: HostToContainer

            - name: bin
              mountPath: /tmp/bin

{{- range $archive := list "all" "ctrl" "all-pernode" "ctrl-pernode" }}
{{- if include "kubeadm.fs.hasFiles" (tuple $k8sConfDict.fs $archive) }}
            - name: fs-{{ $archive }}
              mountPath: /tmp/fs/{{ $archive }}.tar
{{- if hasSuffix "-pernode" $archive }}
              subPathExpr: $(NODE_NAME).tar
{{- else }}
              subPath: {{ $archive }}.tar
{{- end }}
{{- end }}
{{- end }}

            - name: pod-tmp
              mountPath: /tmp
      volumes:
        - name: host
          hostPath:
            path: /
        - name: bin
          configMap:
            name: {{ include "kubeadm.fullname" $envAll }}-bin
            defaultMode: 0555
{{- range $archive := list "all" "ctrl" "all-pernode" "ctrl-pernode" }}
{{- if include "kubeadm.fs.hasFiles" (tuple $k8sConfDict.fs $archive) }}
        - name: fs-{{ $archive }}
          secret:
            secretName: {{ include "kubeadm.fullname" $envAll }}-fs-{{ $archive }}
            defaultMode: 0600
{{- end }}
{{- end }}

        - name: pod-tmp
          emptyDir: {}
