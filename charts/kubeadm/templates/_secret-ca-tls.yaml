{{/* the Kubernetes CA as a kubernetes.io/tls Secret, e.g. for a cert-manager
     CA Issuer on a parent cluster (see _cert-manager-admin.yaml) */}}
{{- $envAll := . -}}

{{- if $envAll.Values.manifests.secret_ca_tls }}
{{- $ca := get ($envAll.Values.certs | default dict) "ca" | default dict }}
{{- if not (and $ca.crt $ca.key) }}
{{- fail "manifests.secret_ca_tls needs certs.ca.crt and certs.ca.key" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeadm.fullname" $envAll }}-ca
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca.crt | b64enc }}
  tls.key: {{ $ca.key | b64enc }}
{{- end }}
