{{/* Note: this file is called from templates/phases/_main.tpl and k8sConfDict contains lots of cached info */}}
{{- $envAll := index . 0 -}}
{{- $k8sConfDict := index . 1 -}}

{{- $fs := get $k8sConfDict "fs" -}}

{{- range $archive := list "all" "ctrl" -}}
{{- if and (index $envAll.Values.manifests (printf "secret_daemonset_fs_%s" $archive)) (include "kubeadm.fs.hasFiles" (tuple $fs $archive)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeadm.fullname" $envAll }}-fs-{{ $archive }}
type: Opaque
data:
  {{ $archive }}.tar: {{ get $fs $archive | include "kubeadm.fs.archive_tar_b64" }}
{{ end -}}
{{- end -}}

{{/*
  right now for 20 nodes I'm getting 150b -
  it means this will work for ~100nodes+.

  if we need more - we'll need to introduce some groups for nodes and separate them via labels
  in order for daemonset to handle that properly. OR even better - we can use kubectl to download
  the a dedicated secret/secrets to the node and in thie secret we can just reference the target.
  that allows basically to share a lot.
*/}}
{{- range $archive := list "all-pernode" "ctrl-pernode" -}}
{{- if and (index $envAll.Values.manifests (printf "secret_daemonset_fs_%s" (replace "-" "_" $archive))) (include "kubeadm.fs.hasFiles" (tuple $fs $archive)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeadm.fullname" $envAll }}-fs-{{ $archive }}
type: Opaque
data:
{{- /* every node with own files gets a key: subPathExpr fails on a missing one, ensure_fs skips the empty ones */}}
{{- range $nodeName,$_ := get $k8sConfDict "perNode" }}
{{- $nodeFs := get (get $fs $archive) $nodeName }}
  {{ $nodeName }}.tar: {{ if $nodeFs }}{{ $nodeFs | include "kubeadm.fs.archive_tar_b64" }}{{ else }}""{{ end }}
{{- end }}
{{ end -}}
{{- end -}}