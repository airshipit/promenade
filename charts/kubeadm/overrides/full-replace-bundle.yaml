
license: |
  # Copyright 2024 AT&T

manifests:
  # disable all chart manifests
  # ovrd_... are all true by default, but can be disabled:
  ovrd_etcd_service: false
  configmap_apiserver_misc: false
  configmap_bin: false
  configmap_certs: false
  configmap_etcd_certs: false
  configmap_kubeconfig: false
  configmap_jobs: false
  configmap_kubelet: false
  configmap_kubeadm: false
  configmap_patches: false
  daemonset_masters: false
  daemonset_workers: false
  etcd_service: false
  rbac: false

# this changes overrides most of manifests and simple templates
# Basically the chart ignores most of its local templates and
# uses new ones.
# similarly it's possilbe to change all manifests
bundle:
  manifests:
    ovrd_configmap_apiserver_misc: "templates/_configmap_apiserver_misc.yaml"
    ovrd_configmap_bin: "templates/_configmap_bin.yaml"
    ovrd_configmap_certs: "templates/_configmap_certs.yaml"
    ovrd_configmap_etcd_certs: "templates/_configmap_etcd_certs.yaml"
    ovrd_configmap_jobs: "templates/_configmap_jobs.yaml"
    ovrd_configmap_kubeadm: "templates/_configmap_kubeadm.yaml"
    ovrd_configmap_kubeconfig: "templates/_configmap_kubeconfig.yaml"
    ovrd_configmap_kubelet: "templates/_configmap_kubelet.yaml"
    ovrd_configmap_patches: "templates/_configmap_patches.yaml"
    ovrd_daemonset_masters: "templates/_daemonset_masters.yaml"
    ovrd_daemonset_workers: "templates/_daemonset_workers.yaml"
    ovrd_etcd_service: "templates/_etcd_service.yaml"
    ovrd_rbac: "templates/_rbac.yaml"
  tpl:
    # simple templates/helpers etc
    "templates/bin/_anchor.tpl": |
      #!/bin/bash
      ## !!!!!!!!!!!!!!added comment
      {{ .Values.license }}

      set -xeuo pipefail

      # directories
      HOST_DIR="{{ .Values.host_dir }}"
      KUBERNETES_DIR="/etc/kubernetes"
      CERT_DIR="${HOST_DIR}${KUBERNETES_DIR}/pki"

      # flow controls
      STATIC_PODS_RESTART_REQUIRED=false
      KUBELET_RESTART_REQUIRED=false

      KUBERNETES_VERSION="{{ .Values.cluster_config.kubernetesVersion }}"
      KUBEADM_ANNOTATION="last-applied-kubeadm-cfg-sha256"
      KUBELET_ANNOTATION="last-applied-kubelet-cfg-sha256"
      CRI_SOCKET_ANNOTATION="kubeadm.alpha.kubernetes.io/cri-socket"

      # Node info
      LAST_APPLIED_KUBEADM_CONFIG_SHA256=""
      LAST_APPLIED_KUBELET_CONFIG_SHA256=""
      CRI_SOCKET=""
      KUBELET_CURRENT_VERSION=""
      KUBERNETES_ETCD=""

      # sleep randomly up to 30 seconds
      sleep $(shuf -i 1-30 -n 1)

      NODE_INFO=$(kubectl get node $NODE_NAME -o jsonpath="{.metadata.annotations.$KUBEADM_ANNOTATION}|{.metadata.annotations.$KUBELET_ANNOTATION}|{.metadata.annotations.$CRI_SOCKET_ANNOTATION}|{.status.nodeInfo.kubeletVersion}|{.metadata.labels.kubernetes-etcd}")
      IFS='|' read -r LAST_APPLIED_KUBEADM_CONFIG_SHA256 LAST_APPLIED_KUBELET_CONFIG_SHA256 CRI_SOCKET KUBELET_CURRENT_VERSION KUBERNETES_ETCD <<<$NODE_INFO

      kubeadm() {
        if [[ "$1" == "version" ]]; then
          command kubeadm $@
        else
          command kubeadm --rootfs "$HOST_DIR" --v=5 $@
        fi
      }

      annotate_node() {
        kubectl annotate node --overwrite "$NODE_NAME" "$1=$2"
      }

      sync_configs() {
        sync_kubeconfigs
        sync_kubelet_configs
        sync_binaries

        if [[ $NODE_ROLE == "master" ]]; then
          rename_cp_pods
          sync_control_plane_certs
          sync_etcd_certs
          sync_apiserver_misc_configs
          sync_kubeadm_configs
          sync_patches
        fi
      }

      compare_copy_file() {
        src=$1
        delete_src=false
        if [ ! -f "$1" ]; then
          src=$(mktemp)
          cat - > $src
          delete_src=true
        fi
        dst=$2

        if [ ! -e "${dst}" ] || ! cmp -s $src $dst; then
          [[ -d "$(dirname ${dst})" ]] || mkdir -p $(dirname "${dst}")
          chmod a+r $(dirname "${dst}")

          cp "${src}" "${dst}"
          chmod a+r "${dst}"

          if [[ "${dst}" == /etc/kubernetes/pki/* ]]; then
            echo "Certificates change detected, static pods will be restarted"
            #STATIC_PODS_RESTART_REQUIRED=true
          fi

          # fix permissions for /etc/kubernetes
          if [[ "${dst}" == $HOST_DIR/etc/kubernetes/* ]]; then
            chmod 0700 $(dirname "${dst}")
            chmod 0600 "${dst}"
          fi

      {{- if .Values.kubelet.restart }}
          if [[ "${dst}" == "${HOST_DIR}/etc/default/kubelet" ||
                "${dst}" == "${HOST_DIR}/etc/systemd/system/kubelet.service" ||
                "${dst}" == "${HOST_DIR}/var/lib/kubelet/config.yaml" ]]; then
            KUBELET_RESTART_REQUIRED=true
          fi
      {{- end }}

        fi

        if [[ $delete_src == true ]]; then
          rm $src
        fi
      }

      rename_cp_pods() {
        cp_pods="etcd apiserver controller-manager scheduler"
        for cp_pod in $cp_pods; do
          src_path="${HOST_DIR}${KUBERNETES_DIR}/manifests/kubernetes-${cp_pod}.yaml"
          dst_path="${HOST_DIR}${KUBERNETES_DIR}/manifests/kube-${cp_pod}.yaml"
          component="kube-${cp_pod}"
          if [[ $cp_pod == "etcd" ]]; then
            dst_path="${HOST_DIR}${KUBERNETES_DIR}/manifests/${cp_pod}.yaml"
            component="${cp_pod}"
          fi
          if [ -e "$src_path" ]; then
            if [ -e "$dst_path" ]; then
              echo "INFO: ${dst_path} already exists; removing stale ${src_path} without overwriting"
              rm -f "$src_path"
              continue
            fi
            if [[ ! -s "$src_path" ]]; then
              echo "WARNING: ${src_path} is empty (previously truncated); removing stale file, skipping rename"
              rm -f "$src_path"
              continue
            fi

            if [ $(kubectl get pods -n kube-system --field-selector "spec.nodeName!=$NODE_NAME" -l component=$component --no-headers | wc -l) -gt 0 ]; then
              kubectl wait --for=condition=ready pods -n kube-system --field-selector "spec.nodeName!=$NODE_NAME" -l component=$component --timeout=180s
            fi
            cp "$src_path" "$dst_path"
            rm "$src_path"
            sed -i -e "s/name: kubernetes-$cp_pod/name: $component/g" "$dst_path"
            sleep 30
            attempts=0
            max_attempts=3
            until kubectl wait --for=condition=ready pod -n kube-system --field-selector spec.nodeName=$NODE_NAME -l component=$component --timeout=180s; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge "$max_attempts" ]; then
                echo "ERROR: $component pod not ready after ${max_attempts} attempts (180s each) following rename; aborting"
                exit 1
              fi
              echo "WARNING: $component pod not ready within 180s after rename (attempt ${attempts}/${max_attempts}); retrying"
            done
          fi
        done
      }

      remove_if_exists() {
        path="$1"
        if [ -e "$path" ]; then
          if [ -d "$path" ]; then rm -rf $path; else rm -f "$path"; fi
        fi
      }

      sync_kubeconfigs() {
        cluster_ip="{{ .Values.kubeconfig.cluster_ip }}"
        cluster_port="{{ .Values.kubeconfig.cluster_port }}"
        cluster_name="{{ .Values.kubeconfig.cluster_name }}"
        {{ range $name, $data := .Values.kubeconfig.configs }}
        if [[ "{{ $name }}" == "kubelet" || $NODE_ROLE == "master" ]]; then
          CLUSTER_IP="$cluster_ip" CLUSTER_PORT="$cluster_port" \
            CERT_AUTH="{{ $data.ca }}" CLUSTER_NAME="$cluster_name" USER="{{ $name }}" \
            CLIENT_CERT="{{ $data.client_cert }}" CLIENT_KEY="{{ $data.client_key }}" \
            envsubst < /tmp/kubeconfig/kubeconfig.yaml.tpl | compare_copy_file - "$HOST_DIR{{ $data.path }}"
        fi
        {{- end }}

        # kubeadm mutates the kubeconfig passed via --kubeconfig if it is a default one
        # (/etc/kubernetes/admin.conf). Operate on a throwaway copy of admin.conf so the
        # synced /etc/kubernetes/admin.conf on the host is not modified.
        # (TODO) move this check prior to kubeadm join command, as well add a check if kubeconfig
        # has been modified due to cert rotation
        if [ $NODE_ROLE == "master" ] && ! kubectl get cm -n kube-public cluster-info; then
          tmp_admin_conf="$(mktemp -p "$HOST_DIR/tmp/" -t temp-kubeconfig.XXXXXX)"
          cp "$HOST_DIR/etc/kubernetes/admin.conf" "$tmp_admin_conf"
          rc=0
          kubeadm init phase bootstrap-token --kubeconfig "${tmp_admin_conf#$HOST_DIR}" || rc=$?
          rm -f "$tmp_admin_conf"
          [ $rc -eq 0 ] || exit $rc
        fi

        echo "kubeconfigs are synced"
      }

      sync_control_plane_certs() {
        for file in /tmp/certs/*; do
          file_name="$(basename $file)"
          compare_copy_file "$file" "$CERT_DIR/$file_name"
        done
      }

      sync_kubelet_certs() {
        echo "placeholder"
      }

      sync_etcd_certs() {
          compare_copy_file /tmp/etcd-certs/ca.crt "$CERT_DIR/etcd/ca.crt"
          compare_copy_file /tmp/etcd-certs/healthcheck-client.crt "$CERT_DIR/etcd/healthcheck-client.crt"
          compare_copy_file /tmp/etcd-certs/healthcheck-client.key "$CERT_DIR/etcd/healthcheck-client.key"

          if [[ $KUBERNETES_ETCD == "enabled" ]]; then
            compare_copy_file /tmp/etcd-certs/ca-peer.crt "$CERT_DIR/etcd/ca-peer.crt"

            compare_copy_file "/tmp/etcd-certs/${NODE_NAME}-peer.crt" "$CERT_DIR/etcd/peer.crt"
            compare_copy_file "/tmp/etcd-certs/${NODE_NAME}-peer.key" "$CERT_DIR/etcd/peer.key"

            compare_copy_file "/tmp/etcd-certs/${NODE_NAME}-server.crt" "$CERT_DIR/etcd/server.crt"
            compare_copy_file "/tmp/etcd-certs/${NODE_NAME}-server.key" "$CERT_DIR/etcd/server.key"
          fi
      }

      sync_patches() {
        for file in /tmp/patches/*; do
          compare_copy_file "$file" "${HOST_DIR}${KUBERNETES_DIR}/kubeadm/patches/$(basename $file)"
        done
      }

      sync_apiserver_misc_configs() {
        if [[ $NODE_ROLE == "master" ]]; then
          for file in /tmp/apiserver-misc/*; do
            compare_copy_file "$file" "${HOST_DIR}${KUBERNETES_DIR}/apiserver/$(basename $file)"
          done
        fi
      }

      sync_kubelet_configs() {
        envsubst < /tmp/kubelet/default-kubelet | compare_copy_file - "${HOST_DIR}/etc/default/kubelet"
        compare_copy_file /tmp/kubelet/kubelet.service "${HOST_DIR}/etc/systemd/system/kubelet.service"
        compare_copy_file /tmp/kubelet/kubelet "${HOST_DIR}/var/lib/kubelet/config.yaml"
      }

      sync_kubeadm_configs() {
        for f in ClusterConfiguration join-config.yaml upgrade-config.yaml; do
          if [[ ! -s "/tmp/kubeadm/$f" ]]; then
            echo "ERROR: /tmp/kubeadm/$f is empty or missing; kube-system/kubeadm-config ConfigMap is not correctly populated; aborting"
            exit 1
          fi
        done
        envsubst < /tmp/kubeadm/join-config.yaml | compare_copy_file - "${HOST_DIR}${KUBERNETES_DIR}/kubeadm/join_config.yaml"
        envsubst < /tmp/kubeadm/upgrade-config.yaml | compare_copy_file - "${HOST_DIR}${KUBERNETES_DIR}/kubeadm/upgrade_config.yaml"

        if [[ $KUBERNETES_ETCD == "enabled" ]]; then
          # do not skip etcd related phases
          sed -i '/check-etcd\|etcd-join/d' "${HOST_DIR}${KUBERNETES_DIR}/kubeadm/join_config.yaml"
          # turn on etcd upgrade
          sed -i -e 's/etcdUpgrade: false/etcdUpgrade: true/g' "${HOST_DIR}${KUBERNETES_DIR}/kubeadm/upgrade_config.yaml"
        fi
      }

      sync_binaries() {
        #envsubst < "/tmp/bin/kubelet_restart.sh" | compare_copy_file - "$HOST_DIR/usr/local/bin/kubelet_restart.sh"
        #chmod a+x "$HOST_DIR/usr/local/bin/kubelet_restart.sh"

        if [[ ! -e "$HOST_DIR/usr/local/bin/kubelet" || $(kubelet --version) != $($HOST_DIR/usr/local/bin/kubelet --version) ]]; then
      {{- if .Values.kubelet.restart }}
          KUBELET_RESTART_REQUIRED=true
      {{- end }}

          install -v -b --suffix=-backup /usr/bin/kubelet $HOST_DIR/usr/local/bin/
        fi

        if [[ $NODE_ROLE == "master" ]]; then
          if [[ ! -e "$HOST_DIR/usr/local/bin/kubeadm" || "$(kubeadm version -o short)" != "$($HOST_DIR/usr/local/bin/kubeadm version -o short)" ]]; then
            install -v -b --suffix=-backup /usr/bin/kubeadm $HOST_DIR/usr/local/bin/
          fi

          if [[ ! -e "$HOST_DIR/usr/local/bin/kubectl" || $(kubectl version --client | grep Client) != $($HOST_DIR/usr/local/bin/kubectl version --client | grep Client) ]]; then
            install -v -b --suffix=-backup /usr/bin/kubectl $HOST_DIR/usr/local/bin/
          fi
        fi
      }

      cleanup_old_backups() {
        if [ -e "$HOST_DIR/etc/kubernetes/tmp/" ]; then
          for p in kubeadm-backup-etcd kubeadm-backup-manifests; do ls -d $HOST_DIR/etc/kubernetes/tmp/$p-* 2>/dev/null | sort | sed '$d' | xargs -r rm -rf || true; done
        fi
      }

      cleanup_old_configs() {
      {{- range $file := .Values.const.files_to_delete }}
        remove_if_exists "${HOST_DIR}{{ $file }}"
      {{- end }}
      }

      restart_kubelet() {
        # kubelet_restart.yaml has to be renamed to node_action.yaml
        kubectl drain "${NODE_NAME}" --pod-selector '!kubelet-restart' --ignore-daemonsets --delete-emptydir-data
        job_name=$(envsubst < "/tmp/jobs/kubelet_restart.yaml.tpl" | kubectl create -f - | grep created | awk '{print $1}')
        kubectl wait -n kube-system --for=condition=complete $job_name --timeout=600s

        kubectl uncordon "${NODE_NAME}"
        kubectl wait node --for=condition=ready "${NODE_NAME}" --timeout=60s

        sleep 60

        KUBELET_CURRENT_VERSION=$(kubectl get node "${NODE_NAME}" -o jsonpath='{.status.nodeInfo.kubeletVersion}')
        if [[ $KUBELET_CURRENT_VERSION != $(kubelet --version | awk '{print $2}') ]]; then
          echo "kubelet version mismatch"
          exit 1
        fi

        sleep 60
      }

      is_action_required() {
        if [[ $NODE_ROLE == "master" ]]; then
          if [ -z $LAST_APPLIED_KUBEADM_CONFIG_SHA256 ]; then return 0; fi
          current_cluster_config_sha256=$(sha256sum < /tmp/kubeadm/ClusterConfiguration | cut -d ' ' -f 1)
          if [[ $LAST_APPLIED_KUBEADM_CONFIG_SHA256 != $current_cluster_config_sha256 ]]; then
            return 0
          fi
        fi

      {{- if .Values.kubelet.restart }}
        if [ -z $LAST_APPLIED_KUBELET_CONFIG_SHA256 ]; then return 0; fi
        current_kubelet_config_sha256=$(sha256sum < /tmp/kubelet/kubelet | cut -d ' ' -f 1)

        if [[ $LAST_APPLIED_KUBELET_CONFIG_SHA256 != $current_kubelet_config_sha256 || $KUBELET_CURRENT_VERSION != $KUBERNETES_VERSION ]]; then
          KUBELET_RESTART_REQUIRED=true
          return 0
        fi
      {{- end }}

        return 1
      }

      verlte() {
          printf '%s\n' "$1" "$2" | sort -C -V
      }

      verlt() {
          ! verlte "$2" "$1"
      }

      kubeadm_action() {
        if [ -z $CRI_SOCKET ]; then
          annotate_node "$CRI_SOCKET_ANNOTATION" "{{ .Values.kubelet.config.containerRuntimeEndpoint }}"
        fi

        if [[ ! -f "${HOST_DIR}${KUBERNETES_DIR}/manifests/kube-apiserver.yaml" ||
             ! -f "${HOST_DIR}${KUBERNETES_DIR}/manifests/kube-controller-manager.yaml" ||
             ! -f "${HOST_DIR}${KUBERNETES_DIR}/manifests/kube-scheduler.yaml"  ]] ||
             [[ $KUBERNETES_ETCD == "enabled" && ! -f "${HOST_DIR}${KUBERNETES_DIR}/manifests/etcd.yaml" ]]; then
          if ! kubeadm join --config "${KUBERNETES_DIR}/kubeadm/join_config.yaml"; then
            if [[ $KUBERNETES_ETCD == "enabled" ]]; then
              echo "kubeadm join failed, performing reset to clean up local etcd member"
              kubeadm reset phase remove-etcd-member
              rm -f "${HOST_DIR}${KUBERNETES_DIR}/manifests/etcd.yaml" || true
              sleep 30
            fi
            exit 1
          fi
        else
          if ! kubectl wait --for=condition=ready pods -n kube-system --field-selector "spec.nodeName=$NODE_NAME" -l tier=control-plane --timeout 30s; then
            echo "control plane pods are not healthy, resetting the node"
            if [[ $KUBERNETES_ETCD == "enabled" ]]; then
              if ! kubectl wait --for=condition=ready pod -n kube-system --field-selector "spec.nodeName=$NODE_NAME" -l component=etcd --timeout 10s 2>/dev/null; then
                echo "performing reset to clean up local etcd member"
                kubeadm reset phase remove-etcd-member
                rm -f "${HOST_DIR}${KUBERNETES_DIR}/manifests/etcd.yaml" || true
                sleep 30
              fi
            fi
            for component in kube-apiserver kube-controller-manager kube-scheduler; do
              if ! kubectl wait --for=condition=ready pod -n kube-system --field-selector "spec.nodeName=$NODE_NAME" -l component=$component --timeout 10s 2>/dev/null; then
                echo "Removing unhealthy static pod manifest for $component"
                rm -f "${HOST_DIR}${KUBERNETES_DIR}/manifests/${component}.yaml"
                sleep 30
              fi
            done
            exit 1
          fi
          if [ $(kubectl get pods -n kube-system --field-selector "spec.nodeName!=$NODE_NAME" -l tier=control-plane --no-headers | wc -l) -gt 0 ]; then
            kubectl wait --for=condition=ready pods -n kube-system --field-selector "spec.nodeName!=$NODE_NAME" -l tier=control-plane --timeout 300s
          fi
          kubeadm upgrade node --config "${KUBERNETES_DIR}/kubeadm/upgrade_config.yaml"
          sync_kubeconfigs
          kubectl wait --for=condition=ready pods -n kube-system --field-selector "spec.nodeName=$NODE_NAME" -l tier=control-plane --timeout 300s
        fi
      }

      if [[ $(kubeadm version -o short) != "$KUBERNETES_VERSION" ]]; then
        echo "Desired kubernetes version mismatch with provided binaries version, please update kubernetes version in values to $(kubeadm version -o short)"
        exit 1
      fi

      cleanup_old_backups
      sync_configs

      if [[ $NODE_ROLE == "master" ]] && is_action_required; then
        kubeadm_action
        LAST_APPLIED_KUBEADM_CONFIG_SHA256="$(sha256sum < /tmp/kubeadm/ClusterConfiguration | cut -d ' ' -f 1)"
        annotate_node "$KUBEADM_ANNOTATION" "$LAST_APPLIED_KUBEADM_CONFIG_SHA256"
      fi

      if [[ $KUBELET_RESTART_REQUIRED == true ]]; then
        restart_kubelet
        LAST_APPLIED_KUBELET_CONFIG_SHA256="$(sha256sum < /tmp/kubelet/kubelet | cut -d ' ' -f 1)"
        annotate_node "$KUBELET_ANNOTATION" "$LAST_APPLIED_KUBELET_CONFIG_SHA256"
      fi

      cleanup_old_configs

      touch /tmp/done

      # main loop
      while true; do
        if [ -e /tmp/stop ] || is_action_required; then
          echo "Stopping"
          break
        fi
        sleep 30
      done
    "templates/bin/_kubelet_restart.tpl": |
      #!/bin/bash
      {{ .Values.license }}

      set -xeuo pipefail

      echo "perform daemon-reload"
      systemctl daemon-reload
      {{- if .Values.kubelet.restart }}
      echo "restarting kubelet service"
      systemctl restart kubelet.service
      {{- end }}

      while ! systemctl is-active --quiet kubelet.service; do
        sleep 5
      done

      exit 0
    "templates/bin/_pre_stop.tpl": |

      #!/bin/sh
      {{ .Values.license }}

      set -ex

      touch /tmp/stop
      sleep {{ .Values.anchor.period }}
    "templates/jobs/_kubelet_restart.yaml.tpl": |
      ---
      apiVersion: batch/v1
      kind: Job
      metadata:
        generateName: kubelet-restart-$NODE_NAME-
        labels:
          "kubelet-restart": "true"
      spec:
        template:
          metadata:
            labels:
              "kubelet-restart": "true"
            annotations:
              container.apparmor.security.beta.kubernetes.io/kubelet-restart: runtime/default
          spec:
            restartPolicy: Never
            serviceAccountName: kubeadm
            serviceAccount: kubeadm
            hostNetwork: true
            enableServiceLinks: true
            hostPID: true
            hostIPC: true
            nodeName: $NODE_NAME
            containers:
              - name: kubelet-restart
                image: {{ .Values.images.tags.anchor }}
                imagePullPolicy: Always
                resources:
                  limits:
                    cpu: '8'
                    memory: 8Gi
                  requests:
                    cpu: 100m
                    memory: 64Mi
                securityContext:
                  privileged: true
                command:
                  - nsenter
                  - '--target'
                  - '1'
                  - '--mount'
                  - '--uts'
                  - '--ipc'
                  - '--net'
                  - '--pid'
                  - kubelet_restart.sh
    "templates/kubeadm/_cluster_config.yaml.tpl": |
      {{ .Values.license }}
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: {{ .Values.cluster_config.kubernetesVersion }}
      apiServer:
        extraArgs:
          - name: etcd-servers
            value: "{{ .Values.cluster_config.apiserver.etcd_endpoints }}"
          - name: v
            value: "{{ .Values.cluster_config.apiserver.log_level }}"
      {{- if .Values.cluster_config.apiserver.extraArgs }}
      {{ toYaml .Values.cluster_config.apiserver.extraArgs | indent 4 }}
      {{- end }}
      {{- if .Values.cluster_config.apiserver.extraVolumes }}
        extraVolumes:
      {{ toYaml .Values.cluster_config.apiserver.extraVolumes | indent 4 }}
      {{- end }}
      certificatesDir: {{ .Values.cluster_config.certificatesDir }}
      clusterName: {{ .Values.cluster_config.clusterName }}
      controlPlaneEndpoint: "{{ .Values.cluster_config.controlPlaneEndpoint }}"
      controllerManager:
        extraArgs:
          - name: v
            value: "{{ .Values.cluster_config.controller_manager.log_level }}"
      {{- if .Values.cluster_config.controller_manager.extraArgs }}
      {{ toYaml .Values.cluster_config.controller_manager.extraArgs | indent 4 }}
      {{- end }}
      {{- if .Values.cluster_config.controller_manager.extraVolumes }}
        extraVolumes:
      {{ toYaml .Values.cluster_config.controller_manager.extraVolumes | indent 4 }}
      {{- end }}
      featureGates:
        NodeLocalCRISocket: false
      dns:
        disabled: true
      encryptionAlgorithm: RSA-2048
      etcd:
        local:
          imageRepository: "{{ .Values.cluster_config.etcd.imageRepository }}"
          dataDir: "{{ .Values.cluster_config.etcd.dataDir }}"
          extraArgs:
      {{- if .Values.cluster_config.etcd.initial_cluster }}
            - name: initial-cluster
              value: "{{ .Values.cluster_config.etcd.initial_cluster }}"
      {{- end }}
      {{- if .Values.cluster_config.etcd.initial_cluster_state }}
            - name: initial-cluster-state
              value: "{{ .Values.cluster_config.etcd.initial_cluster_state }}"
      {{- end }}
      {{- if .Values.cluster_config.etcd.initial_cluster_token }}
            - name: initial-cluster-token
              value: "{{ .Values.cluster_config.etcd.initial_cluster_token }}"
      {{- end }}
            - name: log-level
              value: "{{ .Values.cluster_config.etcd.log_level }}"
      {{- if .Values.cluster_config.etcd.extraArgs }}
      {{ toYaml .Values.cluster_config.etcd.extraArgs | indent 6 }}
      {{- end }}
      {{- if .Values.cluster_config.etcd.extraEnvs }}
          extraEnvs:
      {{ toYaml .Values.cluster_config.etcd.extraEnvs | indent 6 }}
      {{- end }}
      imageRepository: {{ .Values.cluster_config.imageRepository }}
      networking:
      {{ toYaml .Values.cluster_config.networking | indent 2 }}
      proxy:
        disabled: true
      scheduler:
        extraArgs:
          - name: v
            value: "{{ .Values.cluster_config.scheduler.log_level }}"
      {{- if .Values.cluster_config.scheduler.extraArgs }}
      {{ toYaml .Values.cluster_config.scheduler.extraArgs | indent 4 }}
      {{- end }}
      {{- if .Values.cluster_config.scheduler.extraVolumes }}
        extraVolumes:
      {{ toYaml .Values.cluster_config.scheduler.extraVolumes | indent 4 }}
      {{- end }}
    "templates/kubeadm/_join_config.yaml.tpl": |
      {{ .Values.license }}
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: JoinConfiguration
      caCertPath: {{ .Values.join_config.caCertPath }}
      controlPlane:
        localAPIEndpoint:
          advertiseAddress: "${HOST_IP}"
          bindPort: {{ .Values.join_config.controlPlane.localAPIEndpoint.bindPort }}
      discovery:
        file:
          kubeConfigPath: {{ .Values.join_config.discovery.file.kubeConfigPath }}
      nodeRegistration:
        imagePullPolicy: {{ .Values.join_config.nodeRegistration.imagePullPolicy }}
        imagePullSerial: {{ .Values.join_config.nodeRegistration.imagePullSerial }}
        name: ${NODE_NAME}
        ignorePreflightErrors:
      {{ toYaml .Values.join_config.nodeRegistration.ignorePreflightErrors | indent 2 }}
        taints: []
      skipPhases:
      {{ toYaml .Values.join_config.skipPhases }}
      patches:
        directory: {{ .Values.join_config.patches.directory }}
    "templates/kubeadm/_upgrade_config.yaml.tpl": |
      {{ .Values.license }}
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: UpgradeConfiguration
      node:
        certificateRenewal: {{ .Values.upgrade_config.node.certificateRenewal }}
        dryRun: false
        etcdUpgrade: false
        ignorePreflightErrors:
      {{ toYaml .Values.upgrade_config.node.ignorePreflightErrors | indent 2 }}
        patches:
          directory: {{ .Values.upgrade_config.node.patches.directory }}
        skipPhases:
      {{ toYaml .Values.upgrade_config.node.skipPhases | indent 2 }}
        imagePullPolicy: {{ .Values.upgrade_config.node.imagePullPolicy }}
        imagePullSerial: {{ .Values.upgrade_config.node.imagePullSerial }}
    "templates/kubeconfig/_kubeconfig.yaml.tpl": |
      {{ .Values.license }}

      ---
      apiVersion: v1
      clusters:
      - cluster:
          server: https://${CLUSTER_IP}:${CLUSTER_PORT}
          certificate-authority: ${CERT_AUTH}
        name: ${CLUSTER_NAME}
      contexts:
      - context:
          cluster: ${CLUSTER_NAME}
          user: ${USER}
        name: ${USER}@${CLUSTER_NAME}
      current-context: ${USER}@${CLUSTER_NAME}
      kind: Config
      preferences: {}
      users:
      - name: ${USER}
        user:
          client-certificate: ${CLIENT_CERT}
          client-key: ${CLIENT_KEY}
    "templates/kubelet/_kubelet_config.yaml.tpl": |
      {{ .Values.license }}
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      authentication:
        anonymous:
          enabled: false
        webhook:
          enabled: true
        x509:
          clientCAFile: "/etc/kubernetes/pki/kubelet-client-ca.pem"
      authorization:
        mode: AlwaysAllow
      clusterDNS:
        - {{ .Values.network.dns.service_ip }}
      clusterDomain: {{ .Values.network.dns.cluster_domain }}
      staticPodPath: "/etc/kubernetes/manifests"
      tlsCertFile: "/etc/kubernetes/pki/kubelet.pem"
      tlsPrivateKeyFile: "/etc/kubernetes/pki/kubelet-key.pem"
      {{ if .Values.kubelet.config_file_overrides }}
      {{- toYaml .Values.kubelet.config_file_overrides }}
      {{- end }}
    "templates/kubelet/_kubelet-service.yaml.tpl": |
      {{ .Values.license }}

      [Unit]
      Description=Kubernetes Worker Process
      Requires=network-online.target
      After=network-online.target containerd.service

      [Service]
      Environment="KUBELET_KUBECONFIG_ARGS=--bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf"
      Environment="KUBELET_CONFIG_ARGS=--config=/var/lib/kubelet/config.yaml"
      # This is a file that "kubeadm init" and "kubeadm join" generates at runtime, populating the KUBELET_KUBEADM_ARGS variable dynamically
      EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env
      # This is a file that the user can use for overrides of the kubelet args as a last resort. Preferably, the user should use
      # the .NodeRegistration.KubeletExtraArgs object in the configuration files instead. KUBELET_EXTRA_ARGS should be sourced from this file.
      EnvironmentFile=-/etc/default/kubelet
      ExecStart=/usr/local/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_KUBEADM_ARGS $KUBELET_EXTRA_ARGS
      Restart=always
      StartLimitInterval=0
      RestartSec=10
      KillMode=process

      [Install]
      WantedBy=multi-user.target
    "templates/kubelet/_kubelet.yaml.tpl": |
      {{ .Values.license }}

      KUBELET_EXTRA_ARGS="
      --hostname-override=${NODE_NAME}
      --node-ip=${HOST_IP}
      {{- if .Values.kubelet.arguments }}
      {{- range $arg := .Values.kubelet.arguments }}
      {{ $arg }}
      {{- end }}
      {{- end }}
      "
    # manifest templates
    "templates/_configmap_apiserver_misc.yaml": |
      {{- $envAll := . }}

      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .Values.service.name }}-apiserver-misc
      data:
      {{/* Dynamically added apiserver config files */}}
      {{- range $key, $val := .Values.apiserver.config_files }}
      {{- if and (hasKey $val "file") (hasKey $val "content") }}
        {{ $val.file }}: |
      {{- if kindIs "string" $val.content }}
      {{ indent 4 $val.content }}
      {{- else }}
      {{ toYaml $val.content | indent 4 }}
      {{- end }}
      {{- end }}
      {{- end }}
    "templates/_configmap_bin.yaml": |
      {{- $envAll := . }}
      ---
      apiVersion: v1
