      {{ tuple $envAll "templates/bin/_pre_stop.tpl" | include "kubeadm.bundle.template" | indent 4 }}
    "templates/_configmap_certs.yaml": |
      {{- $envAll := . }}

      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .Values.service.name }}-certs
      data:
        apiserver.crt: {{ .Values.secrets.apiserver.crt | quote }}
        apiserver.key: {{ .Values.secrets.apiserver.key | quote }}
        apiserver-etcd-client.crt: {{ .Values.secrets.apiserver.etcd_client.crt | quote }}
        apiserver-etcd-client.key: {{ .Values.secrets.apiserver.etcd_client.key | quote }}
        apiserver-kubelet-client.crt: {{ .Values.secrets.apiserver.kubelet_client.crt | quote }}
        apiserver-kubelet-client.key: {{ .Values.secrets.apiserver.kubelet_client.key | quote }}
        ca.crt: {{ .Values.secrets.ca.crt | quote }}
        ca.key: {{ .Values.secrets.ca.key | quote }}
        controller-manager.pem: {{ .Values.secrets.controller_manager.crt | quote }}
        controller-manager-key.pem: {{ .Values.secrets.controller_manager.key | quote }}
        front-proxy-ca.crt: {{ .Values.secrets.front_proxy_ca.crt | quote }}
        front-proxy-ca.key: {{ .Values.secrets.front_proxy_ca.key | quote }}
        front-proxy-client.crt: {{ .Values.secrets.front_proxy_client.crt | quote }}
        front-proxy-client.key: {{ .Values.secrets.front_proxy_client.key | quote }}
        sa.key: {{ .Values.secrets.sa.key | quote }}
        sa.pub: {{ .Values.secrets.sa.pub | quote }}
        scheduler.pem: {{ .Values.secrets.scheduler.crt | quote }}
        scheduler-key.pem: {{ .Values.secrets.scheduler.key | quote }}
    "templates/_configmap_etcd_certs.yaml": |
      {{- $envAll := . }}

      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .Values.service.name }}-etcd-certs
      data:
        ca.crt: {{ .Values.secrets.etcd.ca.crt | quote }}
        ca-peer.crt: {{ .Values.secrets.etcd.ca_peer.crt | quote }}
        healthcheck-client.crt: {{ .Values.secrets.etcd.healthcheck_client.crt | quote }}
        healthcheck-client.key: {{ .Values.secrets.etcd.healthcheck_client.key | quote }}
      {{- range .Values.secrets.etcd.nodes }}
        {{- $node := . }}
        {{ $node.name }}-server.crt: {{ $node.tls.client.cert | quote }}
        {{ $node.name }}-server.key: {{ $node.tls.client.key | quote }}
        {{ $node.name }}-peer.crt: {{ $node.tls.peer.cert | quote }}
        {{ $node.name }}-peer.key: {{ $node.tls.peer.key | quote }}
      {{- end }}
    "templates/_configmap_jobs.yaml": |
      {{- $envAll := . }}

      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .Values.service.name }}-jobs
      data:
        kubelet_restart.yaml.tpl: |
      {{ tuple $envAll "templates/jobs/_kubelet_restart.yaml.tpl" | include "kubeadm.bundle.template" | indent 4 }}
    "templates/_configmap_kubeadm.yaml": |
      {{- $envAll := . }}

      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kubeadm-config
      data:
        ClusterConfiguration: |
      {{ tuple $envAll "templates/kubeadm/_cluster_config.yaml.tpl" | include "kubeadm.bundle.template" | indent 4 }}
        join-config.yaml: |
      {{ tuple $envAll "templates/kubeadm/_join_config.yaml.tpl" | include "kubeadm.bundle.template" | indent 4 }}
        upgrade-config.yaml: |
      {{ tuple $envAll "templates/kubeadm/_upgrade_config.yaml.tpl" | include "kubeadm.bundle.template" | indent 4 }}
    "templates/_configmap_kubeconfig.yaml": |
      {{- $envAll := . }}

      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .Values.service.name }}-kubeconfig
      data:
        kubeconfig.yaml.tpl: |
      {{ tuple $envAll "templates/kubeconfig/_kubeconfig.yaml.tpl" | include "kubeadm.bundle.template" | indent 4 }}
    "templates/_configmap_kubelet.yaml": |
      {{- $envAll := . }}
      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kubelet-config
      data:
        default-kubelet: |
      {{ tuple $envAll "templates/kubelet/_kubelet.yaml.tpl" | include "kubeadm.bundle.template" | indent 4 }}
        kubelet.service: |
      {{ tuple $envAll "templates/kubelet/_kubelet-service.yaml.tpl" | include "kubeadm.bundle.template" | indent 4 }}
        kubelet: |
      {{ toYaml .Values.kubelet.config | indent 4 }}
    "templates/_configmap_patches.yaml": |
      {{- $envAll := . }}

      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .Values.service.name }}-patches
      data:
      {{- range $file_name, $data := .Values.kubeadm.patches }}
        {{ $file_name }}: |
      {{ toYaml $data | indent 4 }}
      {{- end }}
    "templates/_daemonset_masters.yaml": |
      {{- $envAll := . }}
      {{- $mounts_kubernetes_apiserver := .Values.pod.mounts.kubernetes_apiserver.kubernetes_apiserver }}
      {{- $mounts_kubernetes_apiserver_init := .Values.pod.mounts.kubernetes_apiserver.init_container }}
      {{- $labels := tuple $envAll "kubernetes" "kubernetes-kubeadm-anchor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" }}

      ---
      apiVersion: "apps/v1"
      kind: DaemonSet
      metadata:
        name: {{ .Values.service.name }}-masters-anchor
        labels:
      {{ $labels | indent 4 }}
        annotations:
          {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
      spec:
        selector:
          matchLabels:
      {{ $labels | indent 6 }}
      {{ tuple $envAll "kubernetes-apiserver-anchor" | include "helm-toolkit.snippets.kubernetes_upgrades_daemonset" | indent 2 }}
        template:
          metadata:
            labels:
      {{ $labels | indent 8 }}
            annotations:
              {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
              configmap-bin-hash: {{ tuple . "configmap_bin" | include "kubeadm.bundle.manifest" | sha256sum | quote }}
              configmap-kubeconfig-hash: {{ tuple . "configmap_kubeconfig" | include "kubeadm.bundle.manifest" | sha256sum | quote }}
      {{ dict "envAll" $envAll "podName" "kubernetes_apiserver_anchor" "containerNames" (list "anchor") | include "helm-toolkit.snippets.kubernetes_mandatory_access_control_annotation" | indent 8 }}
          spec:
      {{ dict "envAll" $envAll "application" "kubernetes_apiserver_anchor" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: {{ .Values.labels.common.node_selector_key }}
                          operator: In
                          values:
                            - {{ .Values.labels.common.node_selector_value }}
                        - key: {{ .Values.labels.masters.node_selector_key }}
                          operator: In
                          values:
                            - {{ .Values.labels.masters.node_selector_value }}
            dnsPolicy: {{ .Values.anchor.dns_policy }}
            serviceAccountName: kubeadm
            hostNetwork: true
            priorityClassName: system-node-critical
            tolerations:
              - key: node-role.kubernetes.io/master
                effect: NoSchedule
              - key: CriticalAddonsOnly
                operator: Exists
            terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.kubernetes_apiserver.timeout }}
            containers:
              - name: anchor
                image: {{ .Values.images.tags.anchor }}
                imagePullPolicy: {{ .Values.images.pull_policy }}
      {{ tuple $envAll $envAll.Values.pod.resources.anchor_pod | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
      {{ dict "envAll" $envAll "application" "kubernetes_apiserver_anchor" "container" "anchor" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
                env:
                - name: HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: NODE_ROLE
                  value: "master"
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                command:
                  - /bin/bash
                  - -c
                  - |
                    /tmp/bin/anchor 2>&1 | tee "/host/var/log/kubeadm_output_$(date +%Y%m%d_%H%M%S).log"
                lifecycle:
                  preStop:
                    exec:
                      command:
                        - /tmp/bin/pre_stop

                readinessProbe:
                  exec:
                    command:
                    - /bin/bash
                    - -c
                    - |-
                      cat /tmp/done
      #                [ "$(curl -s -S -o /dev/null \
      #                    --cert "/host{{ .Values.apiserver.host_etc_path }}/pki/apiserver.pem" \
      #                    --key "/host{{ .Values.apiserver.host_etc_path }}/pki/apiserver-key.pem" \
      #                    --cacert "/host{{ .Values.apiserver.host_etc_path }}/pki/cluster-ca.pem" \
      #                    "https://localhost:{{ .Values.network.kubernetes_apiserver.port }}/healthz" \
      #                    -w "%{http_code}")" = "200" ]
      #                exit $?
      #            initialDelaySeconds: 10
      #            periodSeconds: 5
      #            timeoutSeconds: 5

                volumeMounts:
                  - name: host
                    mountPath: {{ .Values.host_dir }}
                    mountPropagation: HostToContainer
                  - name: {{ .Values.service.name }}-certs
                    mountPath: /tmp/certs
                  - name: {{ .Values.service.name }}-etcd-certs
                    mountPath: /tmp/etcd-certs
                  - name: {{ .Values.service.name }}-patches
                    mountPath: /tmp/patches
                  - name: {{ .Values.service.name }}-bin
                    mountPath: /tmp/bin
                  - name: {{ .Values.service.name }}-kubeconfig
                    mountPath: /tmp/kubeconfig
                  - name: {{ .Values.service.name }}-apiserver-misc
                    mountPath: /tmp/apiserver-misc
                  - name: kubelet-config
                    mountPath: /tmp/kubelet
                  - name: kubeadm-config
                    mountPath: /tmp/kubeadm
                  - name: pod-tmp
                    mountPath: /tmp
      {{ if $mounts_kubernetes_apiserver.volumeMounts }}{{ toYaml $mounts_kubernetes_apiserver.volumeMounts | indent 12 }}{{ end }}
            volumes:
              - name: {{ .Values.service.name }}-bin
                configMap:
                  name: {{ .Values.service.name }}-bin
                  defaultMode: 0555
              - name: {{ .Values.service.name }}-apiserver-misc
                configMap:
                  name: {{ .Values.service.name }}-apiserver-misc
                  defaultMode: 0555
              - name: {{ .Values.service.name }}-certs
                configMap:
                  name: {{ .Values.service.name }}-certs
                  defaultMode: 0444
              - name: {{ .Values.service.name }}-etcd-certs
                configMap:
                  name: {{ .Values.service.name }}-etcd-certs
                  defaultMode: 0444
              - name: {{ .Values.service.name }}-patches
                configMap:
                  name: {{ .Values.service.name }}-patches
                  defaultMode: 0444
              - name: host
                hostPath:
                  path: /
              - name: {{ .Values.service.name }}-kubeconfig
                configMap:
                  name: {{ .Values.service.name }}-kubeconfig
                  defaultMode: 0444
              - name: kubelet-config
                configMap:
                  name: kubelet-config
                  defaultMode: 0444
              - name: kubeadm-config
                configMap:
                  name: kubeadm-config
                  defaultMode: 0444
              - name: pod-tmp
                emptyDir: {}
      {{ if $mounts_kubernetes_apiserver.volumes }}{{ toYaml $mounts_kubernetes_apiserver.volumes | indent 8 }}{{ end }}
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
    "templates/_daemonset_workers.yaml": |
      {{- $envAll := . }}
      {{- $mounts_kubernetes_apiserver := .Values.pod.mounts.kubernetes_apiserver.kubernetes_apiserver }}
      {{- $mounts_kubernetes_apiserver_init := .Values.pod.mounts.kubernetes_apiserver.init_container }}
      {{- $labels := tuple $envAll "kubernetes" "kubernetes-kubeadm-workers-anchor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" }}

