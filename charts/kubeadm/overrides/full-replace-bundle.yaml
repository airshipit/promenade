                  defaultMode: 0444
              - name: pod-tmp
                emptyDir: {}
      {{ if $mounts_kubernetes_apiserver.volumes }}{{ toYaml $mounts_kubernetes_apiserver.volumes | indent 8 }}{{ end }}
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 25%
            maxSurge: 0
    "templates/_etcd_service.yaml": |
      {{- $envAll := . }}
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ $envAll.Values.etcd_service.name }}
      spec:
        ports:
          {{ if .Values.etcd_service.service_client.enable_node_port }}
          - name: etcd
            nodePort: {{ .Values.etcd_service.service_client.node_port }}
            port: {{ .Values.etcd_service.service_client.port }}
            protocol: TCP
            targetPort: {{ .Values.etcd_service.service_client.target_port }}
          {{ else }}
          - name: etcd
            port: {{ .Values.etcd_service.service_client.port }}
            protocol: TCP
            targetPort: {{ .Values.etcd_service.service_client.target_port }}
          {{ end }}
        selector:
          component: etcd
        {{- if $envAll.Values.etcd_service.ip }}
        clusterIP: {{ $envAll.Values.etcd_service.ip }}
        {{- end }}
    "templates/_rbac.yaml": |
      ---
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: kubeadm
        namespace: kube-system
      ---
      kind: ClusterRole
      apiVersion: rbac.authorization.k8s.io/v1
      metadata:
        name: kubeadm
        namespace: kube-system
      rules:
        - apiGroups: [""]
          resources:
            - nodes
            - pods
            - pods/eviction
          verbs:
            - "*"
        - apiGroups: [""]
          resources:
            - configmaps
          verbs:
            - "*"
        - apiGroups:
            - ""
            - apps
          resources:
            - daemonsets
          verbs:
            - "*"
        - apiGroups: [ "batch" ]
          resources: [ "jobs" ]
          verbs: [ "*" ]
      ---
      kind: ClusterRoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      metadata:
        name: kubeadm
        namespace: kube-system
      subjects:
        - kind: ServiceAccount
          name: kubeadm
          namespace: kube-system
      roleRef:
        kind: ClusterRole
        name: kubeadm
        apiGroup: rbac.authorization.k8s.io
