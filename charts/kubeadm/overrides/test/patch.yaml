#this to verify that patches work
bundle:
  tpl:
    "templates/_daemonset-masters.yaml.patch": |
      spec:
        template:
          spec:
            terminationGracePeriodSeconds: 2400
            containers:
              - name: anchor
                env:
                  - name: TEST_ENV
                    value: test
    "templates/_daemonset-workers.yaml.patch": |
      spec:
        template:
          spec:
            terminationGracePeriodSeconds: 1200
    "templates/phases/snippets/vip/_haproxy.yaml.tpl.patch": |
      metadata:
        annotations:
          test-annotation: test-value
    "templates/bin/helpers/_kubelet_restart.yaml.tpl.patch": |
      spec:
        template:
          spec:
            containers:
              - name: kubelet-restart
                securityContext:
                  appArmorProfile:
                    type: RuntimeDefault
