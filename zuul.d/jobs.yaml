- job:
    name: airship-promenade-openstack-tox-cover-noble
    parent: openstack-tox-cover
    description: Runs cover job on noble
    nodeset: airship-promenade-single-node-noble
    pre-run: tools/zuul/playbooks/install-deps.yaml

- job:
    name: airship-promenade-openstack-tox-py312-noble
    parent: openstack-tox-py312
    description: Runs cover job on noble
    nodeset: airship-promenade-single-node-noble
    pre-run: tools/zuul/playbooks/install-deps.yaml

- job:
    name: airship-promenade-openstack-tox-pep8-noble
    parent: openstack-tox-pep8
    description: Runs pep8 job on noble
    nodeset: airship-promenade-single-node-noble

- job:
    name: airship-promenade-genesis-containerd-gate
    # need to switch to tigera operator
    voting: true
    description: |
      Deploy airship promenade genesis with containerd
    roles:
      - zuul: openstack/openstack-helm
      - zuul: zuul/zuul-jobs
    run:
      - tools/zuul/playbooks/deploy-promenade-containerd.yaml
    post-run:
      - tools/zuul/playbooks/osh-infra-collect-logs.yaml
    required-projects:
      - openstack/openstack-helm
    timeout: 1800
    nodeset: airship-promenade-single-node-noble
    vars:
      distro: ubuntu_noble

- job:
    name: airship-promenade-kubeadm-chart-test
    description: |
      Mock tests of the kubeadm chart (charts/kubeadm/test.sh): the
      bootstrap script is rendered for different values and executed
      against a mock root filesystem.
    run:
      - tools/zuul/playbooks/kubeadm-chart-test.yaml
    timeout: 1800
    nodeset: airship-promenade-single-node-noble
    files:
      - ^charts/kubeadm/.*$
      - ^tools/helm_install.sh$
      - ^tools/zuul/playbooks/kubeadm-chart-test.yaml$
      - ^zuul.d/.*$
      - ^Makefile$

- job:
    name: airship-promenade-airliner-kubeadm-1node
    description: |
      Deploy the treasuremap airliner site (single node) with the charts of
      the change: the cluster is bootstrapped with the kubeadm chart (day 0),
      then handed over to Armada which deploys Calico (tigera-operator chart)
      and the kubeadm chart in-cluster (day 2), the anchor applies a
      reconfiguration of the control plane.
    voting: false
    parent: treasuremap-airliner-kubeadm-day2-1node
    required-projects:
      - name: airship/treasuremap
        override-checkout: v1.9
    files:
      - ^charts/kubeadm/.*$
      - ^charts/tigera-operator/.*$
      - ^charts/deps/.*$
      - ^tools/helm_tk.sh$
      - ^zuul.d/.*$
      - ^Makefile$
    vars:
      # the charts of the change (Zuul checkout), not promenade master
      promenade_ref: ""
      # the gate scripts and playbooks run in the treasuremap checkout
      zuul_treasuremap_relative_path: ../../airship/treasuremap
      gate_scripts_relative_path: ../../airship/treasuremap

- job:
    name: airship-promenade-jumbojet-kubeadm-5nodes
    description: |
      Deploy the treasuremap jumbojet site (3 control plane nodes, 2 workers)
      with the charts of the change: the cluster is bootstrapped with the
      kubeadm chart (day 0), then handed over to Armada which deploys Calico
      (tigera-operator chart) and the kubeadm chart in-cluster (day 2). Day 2
      scenarios: certificate rotation, reconfiguration with and without
      eviction, Kubernetes upgrade.
    parent: treasuremap-jumbojet-kubeadm-5nodes
    required-projects:
      - name: airship/treasuremap
        override-checkout: v1.9
    files:
      - ^charts/kubeadm/.*$
      - ^charts/tigera-operator/.*$
      - ^charts/deps/.*$
      - ^tools/helm_tk.sh$
      - ^zuul.d/.*$
      - ^Makefile$
    vars:
      # the charts of the change (Zuul checkout), not promenade master
      promenade_ref: ""
      # the gate scripts and playbooks run in the treasuremap checkout
      zuul_treasuremap_relative_path: ../../airship/treasuremap
      gate_scripts_relative_path: ../../airship/treasuremap

- job:
    name: airship-promenade-kubeadm-5nodes
    description: |
      Build a 5 node Kubernetes cluster (3 control plane nodes with stacked
      etcd, 2 workers) on bare nodes with the bootstrap script of the kubeadm
      chart, no other Airship components involved. Only the CAs and the
      service account key are provided to the chart, kubeadm generates the
      rest of the PKI; nodes join with a bootstrap token created once the
      cluster exists. Every node runs haproxy (VIP) for the control plane
      endpoint. Then Calico and the chart itself are deployed from a
      generated kustomize catalog (day 2), a configuration change and an
      upgrade to the next Kubernetes minor version are applied by the
      anchor.
    voting: true
    timeout: 7200
    nodeset: airship-promenade-5nodes-noble
    roles:
      - zuul: openstack/openstack-helm
      - zuul: zuul/zuul-jobs
    required-projects:
      - openstack/openstack-helm
    files:
      - ^charts/kubeadm/.*$
      - ^tools/deployment/kubeadm/.*$
      - ^tools/zuul/playbooks/kubeadm-.*$
      - ^zuul.d/.*$
    pre-run:
      - tools/zuul/playbooks/kubeadm-deploy-env.yaml
    run:
      - tools/zuul/playbooks/kubeadm-5nodes-deploy.yaml
    post-run:
      - tools/zuul/playbooks/kubeadm-collect-logs.yaml
    vars:
      helm_version: "4.1.1"
      # node IPs of the gate values (tools/deployment/kubeadm/values.yaml)
      # on the vxlan overlay network, the primary node runs kubeadm init
      kubeadm_node_ips:
        primary: 10.248.0.11
        node-1: 10.248.0.12
        node-2: 10.248.0.13
        node-3: 10.248.0.21
        node-4: 10.248.0.22
      overlay_network_bridge_ip: "{{ kubeadm_node_ips[inventory_hostname] }}"

- job:
    name: airship-promenade-kubeadm-demo-1node
    description: |
      The demo of the kubeadm chart (overrides/demo/1node-cilium-upgrade.yaml)
      on a single bare node: the demo script of the chart installs
      containerd, bootstraps the node with kubeadm init, installs Cilium and
      the chart itself, runs helm test, upgrades Kubernetes with the chart and
      runs helm test again. It depends on external downloads (containerd,
      Cilium, Kubernetes releases): non-voting, also run weekly to notice them
      breaking.
    voting: false
    timeout: 3600
    nodeset: airship-promenade-single-node-noble
    # the log collection roles of kubeadm-collect-logs.yaml
    roles:
      - zuul: openstack/openstack-helm
      - zuul: zuul/zuul-jobs
    required-projects:
      - openstack/openstack-helm
    files:
      - ^charts/kubeadm/.*$
      - ^tools/zuul/playbooks/kubeadm-demo.*$
      - ^tools/zuul/playbooks/kubeadm-collect-logs.yaml$
      - ^zuul.d/.*$
    pre-run:
      - tools/zuul/playbooks/kubeadm-demo-env.yaml
    run:
      - tools/zuul/playbooks/kubeadm-demo.yaml
    post-run:
      - tools/zuul/playbooks/kubeadm-collect-logs.yaml
    vars:
      helm_version: "4.1.1"

- job:
    name: airship-promenade-chart-build-gate
    description: |
      Lints charts using pinned HTK
    timeout: 3600
    voting: false
    parent: airship-chart-build-base
    nodeset: airship-promenade-single-node-noble
    required-projects:
      - name: airship/treasuremap
        override-checkout: v1.9
    vars:
      HTK_COMMIT: 9b9bed08fbba1aaa5880733afeefddef4a9fd302

- job:
    name: airship-promenade-chart-build-gate-latest-htk
    description: |
      Lints charts using latest HTK
    timeout: 3600
    parent: airship-chart-build-base
    nodeset: airship-promenade-single-node-noble
    required-projects:
      - name: airship/treasuremap
        override-checkout: v1.9
    vars:
      HTK_COMMIT: master


- job:
    name: airship-promenade-docker-build-gate-ubuntu_noble
    timeout: 3600
    voting: false
    parent: airship-docker-build-gate-base
    nodeset: airship-promenade-single-node-noble
    required-projects:
      - name: airship/treasuremap
        override-checkout: v1.9
    vars:
      publish: false
      distro: ubuntu_noble
      run_verbose_build: true
      trivy_fail_on_vulns: true
      trivy_severity: CRITICAL,HIGH
      tags:
        dynamic:
          patch_set: true

- job:
    name: airship-promenade-docker-publish_ubuntu_noble
    timeout: 3600
    parent: airship-docker-build-gate-base
    nodeset: airship-promenade-single-node-noble
    required-projects:
      - name: airship/treasuremap
        override-checkout: v1.9
    secrets:
      - name: quay_creds
        secret: airship_promenade_quay_creds_2026
        pass-to-parent: true
    vars:
      publish: true
      distro: ubuntu_noble
      tags:
        dynamic:
          branch: true
          commit: true
        static:
          - latest
          - airflow_3.2.2

