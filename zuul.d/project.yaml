- project:
    templates:
      - docs-on-readthedocs
    vars:
      rtd_webhook_id: '38575'
      rtd_project_name: 'airship-promenade'
    check:
      jobs:
        - airship-promenade-openstack-tox-cover-noble
        - airship-promenade-openstack-tox-pep8-noble
        - airship-promenade-openstack-tox-py312-noble
        # - airship-promenade-openstack-tox-docs-noble
        - airship-promenade-docker-build-gate-ubuntu_noble
        - airship-promenade-chart-build-gate
        - airship-promenade-chart-build-latest-htk
        - airship-promenade-genesis-containerd-gate
        - airship-promenade-kubeadm-chart-test
        - airship-promenade-kubeadm-5nodes
        - airship-promenade-airliner-kubeadm-1node
        - airship-promenade-kubeadm-demo-1node
        # commented out because it takes 55 minutes to complete
        # you can enable it if you want it here for your tests
        # - airship-promenade-jumbojet-kubeadm-5nodes

    gate:
      jobs:
        - airship-promenade-openstack-tox-cover-noble
        - airship-promenade-openstack-tox-pep8-noble
        - airship-promenade-openstack-tox-py312-noble
        # - airship-promenade-openstack-tox-docs-noble
        - airship-promenade-docker-build-gate-ubuntu_noble
        - airship-promenade-chart-build-gate
        - airship-promenade-chart-build-latest-htk
        - airship-promenade-genesis-containerd-gate
        - airship-promenade-kubeadm-chart-test

    # the demo depends on external downloads
    periodic-weekly:
      jobs:
        - airship-promenade-kubeadm-demo-1node

    post:
      jobs:
        - airship-promenade-docker-publish_ubuntu_noble
        - promenade-upload-git-mirror

...
