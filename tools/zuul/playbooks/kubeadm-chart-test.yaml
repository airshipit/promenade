# Mock tests of the kubeadm chart (charts/kubeadm/test.sh): the bootstrap
# script is rendered for different values and executed against a mock root
# filesystem, no Kubernetes cluster is needed.

- hosts: primary
  vars:
    yq_version: v4.44.3
    yq_sha256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
  tasks:
    - name: Install yq
      get_url:
        url: "https://github.com/mikefarah/yq/releases/download/{{ yq_version }}/yq_linux_amd64"
        dest: /usr/local/bin/yq
        checksum: "sha256:{{ yq_sha256 }}"
        mode: "0755"
      become: true

    - name: Run kubeadm chart tests
      make:
        chdir: "{{ zuul.project.src_dir }}"
        target: test-kubeadm-chart
...
