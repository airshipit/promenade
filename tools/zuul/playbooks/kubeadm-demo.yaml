# Runs the demo of the kubeadm chart exactly as its README says
# (charts/kubeadm/overrides/demo/1node-cilium-upgrade.yaml): without a
# terminal it doesn't start k9s and runs to the end, helm test included.
---
- hosts: primary
  become: true
  tasks:
    - name: Run the demo
      shell: |
        set -o pipefail
        helm template kubeadm ./charts/kubeadm \
          -f ./charts/kubeadm/overrides/demo/1node-cilium-upgrade.yaml \
          --set manifests.secret_tools=true \
          | sed -n 's/^ *demo.sh: *\(.*\)/\1/p' | base64 -d | bash -s -- --yes
      args:
        chdir: "{{ zuul.project.src_dir }}"
        executable: /bin/bash
...
