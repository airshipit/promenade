---
- hosts: all
  vars_files:
    - vars.yaml
  vars:
    work_dir: "{{ zuul.project.src_dir }}"
    logs_dir: "/tmp/logs"
  roles:
    - gather-host-logs

# admin.conf generated by kubeadm embeds the credentials, unlike the one of
# the genesis gate (see the setup-kubeconfig role)
- hosts: primary
  vars_files:
    - vars.yaml
  vars:
    work_dir: "{{ zuul.project.src_dir }}"
    logs_dir: "/tmp/logs"
  pre_tasks:
    - name: Set up kubeconfig
      become: true
      shell: |
        set -e
        test -f /etc/kubernetes/admin.conf || exit 0
        install -d -o zuul -g zuul -m 0700 ~zuul/.kube
        install -o zuul -g zuul -m 0600 /etc/kubernetes/admin.conf ~zuul/.kube/config
      args:
        executable: /bin/bash
  roles:
    - helm-release-status
    - describe-kubernetes-objects
    - gather-pod-logs
...
