# Prepare bare nodes for the kubeadm chart gate. Kubernetes is NOT deployed
# here: only the parts of the openstack-helm deploy-env role which the
# bootstrap script of the chart expects to be present on the node are used
# (packages, containerd, the overlay network carrying the node IPs of the
# gate values).
---
- hosts: all
  become: true
  gather_facts: true

  roles:
    - ensure-python
    - ensure-pip
    - clear-firewall

  tasks:
    - name: Install prerequisites
      include_role:
        name: deploy-env
        tasks_from: prerequisites.yaml

    - name: Deploy containerd
      include_role:
        name: deploy-env
        tasks_from: containerd.yaml

    - name: Overlay network
      include_role:
        name: deploy-env
        tasks_from: overlay.yaml

    # used by tools/deployment/kubeadm scripts
    - name: Install packages
      apt:
        name:
          - python3-yaml
          - openssl
        state: present

    # Local resolvers (systemd-resolved, unbound) listen on the loopback
    # interface which is not reachable from CoreDNS pods.
    - name: Disable local DNS resolvers
      service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - systemd-resolved
        - unbound
      failed_when: false

    - name: Configure resolv.conf
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 8.8.8.8
        mode: "0644"
        follow: false

- hosts: all
  roles:
    - ensure-helm
...
